<title>Velthiros</title>
<style>
/* Velthiros - the page is a frame around a single full-bleed canvas */
:root {
  color-scheme: dark;
  --ink: #f2ecff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #0d0916;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game {
  display: block;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  touch-action: none;
  cursor: default;
}
/* shown until the first frame paints */
#boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 10px;
  text-align: center;
  background: #0d0916;
  z-index: 10;
  transition: opacity 0.4s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }
#boot h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 0.16em;
  color: #ffe9c9;
}
#boot p { margin: 0; font-size: 12px; opacity: 0.5; }
/* nudge for portrait phones - the game plays best in landscape */
#rotate {
  position: fixed;
  left: 50%;
  bottom: 6px;
  transform: translateX(-50%);
  font-size: 11px;
  opacity: 0.4;
  pointer-events: none;
  display: none;
  z-index: 5;
}
@media (orientation: portrait) and (max-width: 560px) {
  #rotate { display: block; }
}
</style>

/* Velthiros - shared math, rng and helpers */
(function (V) {
  'use strict';

  var U = {};

  U.TAU = Math.PI * 2;

  U.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };
  U.lerp = function (a, b, t) { return a + (b - a) * t; };
  U.dist = function (ax, ay, bx, by) { var dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); };
  U.dist2 = function (ax, ay, bx, by) { var dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };

  /* shortest signed angular difference b - a, wrapped to [-PI, PI] */
  U.angleDelta = function (a, b) {
    var d = (b - a) % U.TAU;
    if (d > Math.PI) d -= U.TAU;
    if (d < -Math.PI) d += U.TAU;
    return d;
  };

  U.approach = function (v, target, step) {
    if (v < target) return Math.min(v + step, target);
    if (v > target) return Math.max(v - step, target);
    return target;
  };

  U.easeOut = function (t) { return 1 - (1 - t) * (1 - t); };
  U.easeIn = function (t) { return t * t; };
  U.easeInOut = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };

  /* Mulberry32 - small deterministic PRNG so a trial seed rebuilds the same arena */
  U.rng = function (seed) {
    var a = seed >>> 0;
    var r = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = function (lo, hi) { return lo + r() * (hi - lo); };
    r.int = function (lo, hi) { return Math.floor(lo + r() * (hi - lo + 1)); };
    r.pick = function (arr) { return arr[Math.floor(r() * arr.length)]; };
    r.chance = function (p) { return r() < p; };
    r.shuffle = function (arr) {
      var out = arr.slice();
      for (var i = out.length - 1; i > 0; i--) {
        var j = Math.floor(r() * (i + 1));
        var t = out[i]; out[i] = out[j]; out[j] = t;
      }
      return out;
    };
    return r;
  };

  /* string -> 32 bit hash, used to derive stable seeds from names */
  U.hash = function (str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };

  U.fmtTime = function (sec) {
    if (sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  U.fmtNum = function (n) {
    n = Math.floor(n);
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  };

  /* point inside a circle */
  U.inCircle = function (px, py, cx, cy, r) { return U.dist2(px, py, cx, cy) <= r * r; };

  /* push a point back inside a circular boundary, returns true if it moved */
  U.confineToCircle = function (p, cx, cy, r) {
    var dx = p.x - cx, dy = p.y - cy;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d <= r) return false;
    if (d === 0) { p.x = cx + r; return true; }
    p.x = cx + (dx / d) * r;
    p.y = cy + (dy / d) * r;
    return true;
  };

  /* is target inside a cone centred on `facing`? */
  U.inArc = function (ax, ay, facing, halfArc, range, tx, ty) {
    var dx = tx - ax, dy = ty - ay;
    var d2 = dx * dx + dy * dy;
    if (d2 > range * range) return false;
    if (d2 < 1) return true;
    var a = Math.atan2(dy, dx);
    return Math.abs(U.angleDelta(facing, a)) <= halfArc;
  };

  /* The world's Y axis is squashed on screen (3/4 view), so a target's world
     angle is not the angle the player sees. Aiming and hit tests use this
     visual angle instead, otherwise diagonal swings miss things that plainly
     look like they are in front of you. */
  U.visualAngle = function (dx, dy, squash) { return Math.atan2(dy * squash, dx); };

  U.inArcVisual = function (ax, ay, facing, halfArc, range, tx, ty, squash) {
    var dx = tx - ax, dy = ty - ay;
    var d2 = dx * dx + dy * dy;
    if (d2 > range * range) return false;
    if (d2 < 1) return true;
    var fv = Math.atan2(Math.sin(facing) * squash, Math.cos(facing));
    var av = Math.atan2(dy * squash, dx);
    return Math.abs(U.angleDelta(fv, av)) <= halfArc;
  };

    var map = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
    return map[n] || String(n);

     Every character is built from the same chibi rig so the cast reads as
     one family: big head, stubby limbs, heavy outline, single highlight. */
  /* Proportions live here. The GDD asked for Mario-ish chibi; playtesting
     pushed toward a taller, more grounded sprite that survives being drawn at
     pixel-buffer resolution. Head is ~a third of total height. */
  Art.RIG = {
    head: 9,      /* head radius */
    bodyW: 14,
    bodyH: 21,
    legH: 20,
    legW: 5.5,
    armW: 4.6,
    armH: 13
  };

  function chibi(ctx, o) {
    var s = o.scale;
    var R = Art.RIG;
    var bob = Math.sin(o.phase) * 1.5 * s * (o.moving ? 1 : 0.45);
    var lean = o.lean || 0;
    var headR = R.head * s;
    var bodyW = R.bodyW * s, bodyH = R.bodyH * s;
    var legH = R.legH * s, legW = R.legW * s;
    var footY = 0;
    /* torso overlaps the legs slightly so the bob never opens a gap */
    var bodyY = footY - legH - bodyH + bob + 3 * s;
    var headY = bodyY - headR * 0.72;

    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(lean);

    /* legs - feet stay planted, only the body bobs */
    var stride = Math.sin(o.phase) * 5.5 * s * (o.moving ? 1 : 0);
    ctx.fillStyle = o.legs || Art.shade(o.body, -40);
    Art.roundRect(ctx, -legW - 0.7 * s - stride * 0.5, footY - legH, legW, legH, 2 * s);
    ctx.fill(); Art.outline(ctx, 1.7 * s);
    Art.roundRect(ctx, 0.7 * s + stride * 0.5, footY - legH, legW, legH, 2 * s);
    ctx.fill(); Art.outline(ctx, 1.7 * s);

    /* torso */
    ctx.fillStyle = o.body;
    Art.roundRect(ctx, -bodyW / 2, bodyY, bodyW, bodyH, 4 * s); ctx.fill(); Art.outline(ctx, 1.9 * s);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    Art.roundRect(ctx, -bodyW / 2 + 2 * s, bodyY + 2 * s, bodyW * 0.32, bodyH * 0.55, 2 * s); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    Art.roundRect(ctx, bodyW / 2 - 3.4 * s, bodyY + 2 * s, 2.6 * s, bodyH * 0.8, 1.4 * s); ctx.fill();

    /* arms */
    var armSwing = Math.sin(o.phase + Math.PI) * 4.5 * s * (o.moving ? 1 : 0);
    var armW = R.armW * s, armH = R.armH * s;
    ctx.fillStyle = o.skin;
    Art.roundRect(ctx, -bodyW / 2 - armW + 0.8 * s, bodyY + 3 * s + armSwing, armW, armH, 2.1 * s);
    ctx.fill(); Art.outline(ctx, 1.5 * s);
    if (!o.hideRightArm) {
      Art.roundRect(ctx, bodyW / 2 - 0.8 * s, bodyY + 3 * s - armSwing, armW, armH, 2.1 * s);
      ctx.fill(); Art.outline(ctx, 1.5 * s);
    }

    /* neck + head */
    ctx.fillStyle = Art.shade(o.skin, -18);
    Art.roundRect(ctx, -2.4 * s, bodyY - 3 * s, 4.8 * s, 5 * s, 1.6 * s); ctx.fill();
    ctx.fillStyle = o.skin;
    Art.ellipse(ctx, 0, headY, headR, headR * 1.02); ctx.fill(); Art.outline(ctx, 1.9 * s);

    if (o.hair) {
      ctx.fillStyle = o.hair;
      ctx.beginPath();
      ctx.ellipse(0, headY - headR * 0.3, headR * 1.04, headR * 0.76, 0, Math.PI, U.TAU);
      ctx.closePath();
      ctx.fill(); Art.outline(ctx, 1.5 * s);
    }
    if (o.horns) {
      ctx.fillStyle = '#efe3c8';
      [-1, 1].forEach(function (sgn) {
        ctx.beginPath();
        ctx.moveTo(sgn * headR * 0.74, headY - headR * 0.2);
        ctx.quadraticCurveTo(sgn * headR * 1.6, headY - headR * 0.95, sgn * headR * 1.1, headY - headR * 1.35);
        ctx.quadraticCurveTo(sgn * headR * 1.05, headY - headR * 0.55, sgn * headR * 0.6, headY - headR * 0.3);
        ctx.closePath(); ctx.fill(); Art.outline(ctx, 1.3 * s);
      });
    }
    if (o.hood) {
      ctx.fillStyle = o.hood;
      ctx.beginPath();
      ctx.ellipse(0, headY - headR * 0.06, headR * 1.18, headR * 1.12, 0, Math.PI * 0.9, Math.PI * 2.1);
      ctx.closePath(); ctx.fill(); Art.outline(ctx, 1.8 * s);
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      Art.ellipse(ctx, 0, headY + headR * 0.2, headR * 0.74, headR * 0.66); ctx.fill();
    }

    if (!o.hood && o.faceDir !== 0) {
      var fx = o.faceDir * 1.8 * s;
      ctx.fillStyle = '#2b2231';
      Art.ellipse(ctx, fx - 3.2 * s, headY + 0.6 * s, 1.5 * s, 2 * s); ctx.fill();
      Art.ellipse(ctx, fx + 3.2 * s, headY + 0.6 * s, 1.5 * s, 2 * s); ctx.fill();
      if (o.eyeGlow) {
        ctx.fillStyle = o.eyeGlow;
        Art.ellipse(ctx, fx - 3.2 * s, headY + 0.6 * s, 1 * s, 1.4 * s); ctx.fill();
        Art.ellipse(ctx, fx + 3.2 * s, headY + 0.6 * s, 1 * s, 1.4 * s); ctx.fill();
      }
    } else if (o.hood && o.eyeGlow) {
      ctx.fillStyle = o.eyeGlow;
      Art.ellipse(ctx, -2.8 * s, headY + 1.6 * s, 1.4 * s, 1.4 * s); ctx.fill();
      Art.ellipse(ctx, 2.8 * s, headY + 1.6 * s, 1.4 * s, 1.4 * s); ctx.fill();
    }

    ctx.restore();
    return { headY: headY, bodyY: bodyY, scale: s };
  }
  Art.chibi = chibi;

  /* ------------------------------------------------------------- weapons */
  Art.drawWeapon = function (ctx, id, x, y, scale, angle, swing) {
    var s = scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    if (id === 'sword') {
      ctx.fillStyle = '#dfe6ee';
      Art.roundRect(ctx, 0, -2.6 * s, 27 * s, 5.2 * s, 2 * s); ctx.fill(); Art.outline(ctx, 1.8 * s);
      ctx.fillStyle = '#8a5a33';
      Art.roundRect(ctx, -7 * s, -2.4 * s, 8 * s, 4.8 * s, 2 * s); ctx.fill(); Art.outline(ctx, 1.4 * s);
      ctx.fillStyle = '#e8c14a';
      Art.roundRect(ctx, -0.5 * s, -5.5 * s, 3 * s, 11 * s, 1.4 * s); ctx.fill(); Art.outline(ctx, 1.2 * s);
    } else if (id === 'battleaxe') {
      ctx.fillStyle = '#6b4a2c';
      Art.roundRect(ctx, -8 * s, -2 * s, 30 * s, 4 * s, 1.6 * s); ctx.fill(); Art.outline(ctx, 1.5 * s);
      ctx.fillStyle = '#cfd8e2';
      ctx.beginPath();
      ctx.moveTo(15 * s, -3 * s);
      ctx.quadraticCurveTo(29 * s, -16 * s, 33 * s, 0);
      ctx.quadraticCurveTo(29 * s, 16 * s, 15 * s, 3 * s);
      ctx.closePath(); ctx.fill(); Art.outline(ctx, 1.8 * s);
    } else if (id === 'bow') {
      var br = 17 * s;
      ctx.strokeStyle = '#3a2a1a';
      ctx.lineWidth = 6 * s;
      ctx.beginPath();
      ctx.arc(0, 0, br, -1.25, 1.25);
      ctx.stroke();
      ctx.strokeStyle = '#a5713d';
      ctx.lineWidth = 3.4 * s;
      ctx.beginPath();
      ctx.arc(0, 0, br, -1.25, 1.25);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(250,250,250,0.9)';
      ctx.lineWidth = 1.6 * s;
      ctx.beginPath();
      ctx.moveTo(br * Math.cos(-1.25), br * Math.sin(-1.25));
      ctx.lineTo(2 * s - (swing || 0) * 9 * s, 0);
      ctx.lineTo(br * Math.cos(1.25), br * Math.sin(1.25));
      ctx.stroke();
    } else if (id === 'scythe') {
      ctx.fillStyle = '#3a2f43';
      Art.roundRect(ctx, -10 * s, -2 * s, 34 * s, 3.6 * s, 1.6 * s); ctx.fill(); Art.outline(ctx, 1.5 * s);
      ctx.fillStyle = '#c9f0ea';
      ctx.beginPath();
      ctx.moveTo(22 * s, 0);
      ctx.quadraticCurveTo(40 * s, -6 * s, 34 * s, -20 * s);
      ctx.quadraticCurveTo(34 * s, -7 * s, 21 * s, -4 * s);
      ctx.closePath(); ctx.fill(); Art.outline(ctx, 1.7 * s);
    }
    ctx.restore();
  };

  /* --------------------------------------------------------------- actors */
  Art.drawPlayer = function (ctx, p, t) {
    var s = p.drawScale || 1;
    Art.shadow(ctx, p.sx, p.sy, 14 * s, p.z > 2 ? 0.14 : 0.24);
    var faceDir = Math.cos(p.facing) > 0.25 ? 1 : (Math.cos(p.facing) < -0.25 ? -1 : 0);
    var yy = p.sy - (p.z || 0);
    var flashing = p.hurtFlash > 0 && Math.floor(p.hurtFlash * 24) % 2 === 0;

    if (flashing) { ctx.save(); ctx.globalAlpha = 0.55; }

    /* weapon behind the body when swinging away from camera */
    var wpnBehind = Math.sin(p.facing) < -0.1;
    var swingT = p.attackTimer > 0 ? 1 - (p.attackTimer / Math.max(p.attackDuration, 0.01)) : 0;
    var wAngle = p.facing + (p.attacking ? U.lerp(-0.9, 1.1, swingT) : 0.5);
    var wx = p.sx + Math.cos(p.facing) * 12 * s;
    var wy = yy - 25 * s + Math.sin(p.facing) * 5 * s;

    if (wpnBehind) Art.drawWeapon(ctx, p.weaponId, wx, wy, s, wAngle, p.drawT || 0);

    chibi(ctx, {
      x: p.sx, y: yy, scale: s, phase: p.animPhase, moving: p.moving,
      body: p.tint || '#4f8fd6', skin: '#f5c9a0', hair: '#5b3d2b',
      faceDir: faceDir, legs: '#3f6ea8', lean: p.lean || 0
    });

    if (!wpnBehind) Art.drawWeapon(ctx, p.weaponId, wx, wy, s, wAngle, p.drawT || 0);

    if (flashing) ctx.restore();

    if (p.hidden) {
      ctx.fillStyle = 'rgba(120,200,140,0.28)';
      Art.ellipse(ctx, p.sx, yy - 30 * s, 24 * s, 30 * s); ctx.fill();
    }
    if (p.invuln > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.25 + 0.2 * Math.sin(t * 22)) + ')';
      ctx.lineWidth = 2;
      Art.ellipse(ctx, p.sx, p.sy, 20 * s, 9 * s); ctx.stroke();
    }
  };

  Art.drawGoblin = function (ctx, e) {
    var s = e.drawScale;
    Art.shadow(ctx, e.sx, e.sy, 13 * s);
    var yy = e.sy - (e.z || 0);
    var faceDir = Math.cos(e.facing) > 0.25 ? 1 : (Math.cos(e.facing) < -0.25 ? -1 : 0);
    var alert = e.state === 'windup';
    if (e.hurtFlash > 0) ctx.globalAlpha = 0.6;
    chibi(ctx, {
      x: e.sx, y: yy, scale: s * 0.86, phase: e.animPhase, moving: e.moving,
      body: '#6f5236', skin: e.def.colour, legs: '#5b4229',
      faceDir: faceDir, eyeGlow: alert ? '#ffdd55' : null,
      lean: alert ? Math.sin(e.stateTime * 30) * 0.06 : 0
    });
    ctx.globalAlpha = 1;
    /* crude club */
    var wa = e.facing + (alert ? -0.9 : 0.6);
    ctx.save();
    ctx.translate(e.sx + Math.cos(e.facing) * 10 * s, yy - 28 * s);
    ctx.rotate(wa);
    ctx.fillStyle = '#6b4a2c';
    Art.roundRect(ctx, 0, -2 * s, 17 * s, 4 * s, 2 * s); ctx.fill(); Art.outline(ctx, 1.4 * s);
    ctx.restore();
  };

  Art.drawMinotaur = function (ctx, e) {
    var s = e.drawScale * 1.35;
    Art.shadow(ctx, e.sx, e.sy, 20 * s * 0.8);
    var yy = e.sy - (e.z || 0);
    var faceDir = Math.cos(e.facing) > 0.25 ? 1 : (Math.cos(e.facing) < -0.25 ? -1 : 0);
    var alert = e.state === 'windup' || e.state === 'charge';
    if (e.hurtFlash > 0) ctx.globalAlpha = 0.6;
    chibi(ctx, {
      x: e.sx, y: yy, scale: s, phase: e.animPhase, moving: e.moving,
      body: '#8a5b3a', skin: e.def.colour, legs: '#6b4227', horns: true,
      faceDir: faceDir, eyeGlow: alert ? '#ff6a3c' : null,
      lean: e.state === 'charge' ? 0.14 * Math.sign(Math.cos(e.facing) || 1) : 0
    });
    ctx.globalAlpha = 1;
    Art.drawWeapon(ctx, 'battleaxe', e.sx + Math.cos(e.facing) * 13 * s, yy - 36 * s, s * 0.8,
      e.facing + (alert ? -1.1 : 0.5), 0);
  };

  Art.drawReaper = function (ctx, e, t) {
    var s = e.drawScale * 1.45;
    Art.shadow(ctx, e.sx, e.sy, 22 * s * 0.8, 0.3);
    var yy = e.sy - (e.z || 0) - Math.sin(t * 2) * 4;
    var alert = e.state === 'windup';
    if (e.hurtFlash > 0) ctx.globalAlpha = 0.6;

    /* trailing cloak */
    ctx.fillStyle = 'rgba(30,26,44,0.9)';
    ctx.beginPath();
    ctx.moveTo(e.sx - 16 * s, yy - 34 * s);
    ctx.quadraticCurveTo(e.sx - 22 * s, yy + 6, e.sx, yy + 4);
    ctx.quadraticCurveTo(e.sx + 22 * s, yy + 6, e.sx + 16 * s, yy - 34 * s);
    ctx.closePath(); ctx.fill(); Art.outline(ctx, 2);

    chibi(ctx, {
      x: e.sx, y: yy, scale: s, phase: e.animPhase, moving: e.moving,
      body: e.def.colour, skin: '#cfc6d8', legs: e.def.dark,
      hood: '#2a2438', eyeGlow: alert ? '#ff4d5e' : '#9b6bff', faceDir: 1
    });
    ctx.globalAlpha = 1;
    Art.drawWeapon(ctx, 'scythe', e.sx + Math.cos(e.facing) * 14 * s, yy - 40 * s, s,
      e.facing + (alert ? -1.2 : 0.4), 0);
  };

  /* Final boss - the provided reference: pale winged figure, insectoid core,
     a single red eye, twin red sockets on the abdomen. */
  Art.drawAurelith = function (ctx, e, t) {
    var s = e.drawScale * 2.1;
    Art.shadow(ctx, e.sx, e.sy, 34 * s * 0.7, 0.3);
    var yy = e.sy - (e.z || 0) - 10 - Math.sin(t * 1.4) * 6;
    var flap = Math.sin(t * 1.8) * 0.16;

    /* six wings */
    for (var i = 0; i < 3; i++) {
      var spread = 0.55 + i * 0.42 + flap;
      [-1, 1].forEach(function (sgn) {
        ctx.save();
        ctx.translate(e.sx, yy - 34 * s);
        ctx.rotate(sgn * spread);
        ctx.fillStyle = i === 0 ? '#ffffff' : (i === 1 ? '#f2eef6' : '#e4dced');
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(sgn * 34 * s, -14 * s, sgn * 62 * s, 6 * s);
        ctx.quadraticCurveTo(sgn * 34 * s, 10 * s, 0, 8 * s);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(70,60,80,0.5)'; ctx.lineWidth = 1.6; ctx.stroke();
        ctx.restore();
      });
    }

    /* carapace torso */
    ctx.fillStyle = e.def.dark;
    Art.roundRect(ctx, e.sx - 16 * s, yy - 40 * s, 32 * s, 34 * s, 10 * s); ctx.fill(); Art.outline(ctx, 2.4);
    /* web pattern */
    ctx.strokeStyle = 'rgba(220,210,230,0.32)'; ctx.lineWidth = 1.2;
    for (var w = -2; w <= 2; w++) {
      ctx.beginPath();
      ctx.moveTo(e.sx + w * 6 * s, yy - 40 * s);
      ctx.lineTo(e.sx + w * 3 * s, yy - 8 * s);
      ctx.stroke();
    }
    /* orange growths */
    ctx.fillStyle = '#ff6a33';
    for (var g = 0; g < 7; g++) {
      var ga = g / 7 * Math.PI - Math.PI / 2;
      Art.ellipse(ctx, e.sx + Math.cos(ga) * 15 * s, yy - 34 * s + Math.sin(ga) * 9 * s, 2.6 * s, 2.6 * s);
      ctx.fill();
    }
    /* twin red sockets */
    ctx.fillStyle = '#ff2f4a';
    Art.ellipse(ctx, e.sx - 7 * s, yy - 16 * s, 3.4 * s, 4.2 * s); ctx.fill();
    Art.ellipse(ctx, e.sx + 7 * s, yy - 16 * s, 3.4 * s, 4.2 * s); ctx.fill();

    /* elongated pale head with the single gem eye */
    ctx.fillStyle = e.def.colour;
    Art.ellipse(ctx, e.sx, yy - 54 * s, 9 * s, 15 * s); ctx.fill(); Art.outline(ctx, 2.2);
    ctx.fillStyle = '#ff2f4a';
    Art.ellipse(ctx, e.sx, yy - 56 * s, 3.6 * s, 3.6 * s); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    Art.ellipse(ctx, e.sx - 1 * s, yy - 57 * s, 1.2 * s, 1.2 * s); ctx.fill();

    /* insect legs */
    ctx.strokeStyle = e.def.dark; ctx.lineWidth = 3 * s * 0.6;
    [-1, 1].forEach(function (sgn) {
      for (var l = 0; l < 2; l++) {
        ctx.beginPath();
        ctx.moveTo(e.sx + sgn * 8 * s, yy - 12 * s);
        ctx.quadraticCurveTo(e.sx + sgn * (22 + l * 8) * s, yy - 4 * s, e.sx + sgn * (14 + l * 10) * s, yy + 2);
        ctx.stroke();
      }
    });

    /* floating X blade fragments */
    ctx.strokeStyle = 'rgba(240,235,245,0.8)'; ctx.lineWidth = 2;
    for (var f = 0; f < 4; f++) {
      var fa = t * 0.6 + f * 1.57;
      var fx = e.sx + Math.cos(fa) * 40 * s, fy = yy - 14 * s + Math.sin(fa) * 10 * s;
      ctx.beginPath();
      ctx.moveTo(fx - 5, fy - 5); ctx.lineTo(fx + 5, fy + 5);
      ctx.moveTo(fx + 5, fy - 5); ctx.lineTo(fx - 5, fy + 5);
      ctx.stroke();
    }
  };

  /* Garatu - the abductor. Winged demon, seen mostly in cutscenes. */
  Art.drawGaratu = function (ctx, x, y, scale, t) {
    var s = scale;
    var flap = Math.sin(t * 3.2) * 0.4;
    ctx.save();
    ctx.translate(x, y);

    [-1, 1].forEach(function (sgn) {
      ctx.save();
      ctx.rotate(sgn * (0.5 + flap));
      ctx.fillStyle = '#43213a';
      ctx.beginPath();
      ctx.moveTo(0, -30 * s);
      ctx.quadraticCurveTo(sgn * 46 * s, -56 * s, sgn * 70 * s, -18 * s);
      ctx.quadraticCurveTo(sgn * 44 * s, -26 * s, sgn * 50 * s, -2 * s);
      ctx.quadraticCurveTo(sgn * 30 * s, -14 * s, sgn * 28 * s, 6 * s);
      ctx.quadraticCurveTo(sgn * 14 * s, -10 * s, 0, -22 * s);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(20,10,20,0.8)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    });

    chibi(ctx, {
      x: 0, y: 0, scale: s * 1.25, phase: t * 2, moving: false,
      body: '#5c2b4a', skin: '#c9526a', legs: '#3d1c31',
      horns: true, faceDir: 1, eyeGlow: '#ffd24a'
    });
    ctx.restore();
  };

  /* ----------------------------------------------------------- environment */
  Art.drawProp = function (ctx, kind, x, y, s, seed, t) {
    var r = U.rng(seed);
    switch (kind) {
      case 'tree': {
        ctx.fillStyle = 'rgba(20,26,18,0.22)';
        Art.ellipse(ctx, x, y, 20 * s, 8 * s); ctx.fill();
        ctx.fillStyle = '#6b4a2c';
        Art.roundRect(ctx, x - 5 * s, y - 30 * s, 10 * s, 30 * s, 3 * s); ctx.fill(); Art.outline(ctx, 2);
        var lay = [[0, -58, 26], [-11, -44, 20], [11, -44, 20]];
        for (var i = 0; i < lay.length; i++) {
          ctx.fillStyle = i === 0 ? '#4f9a49' : '#3f8a3d';
          Art.ellipse(ctx, x + lay[i][0] * s, y + lay[i][1] * s, lay[i][2] * s, lay[i][2] * 0.86 * s);
          ctx.fill(); Art.outline(ctx, 2);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        Art.ellipse(ctx, x - 8 * s, y - 64 * s, 9 * s, 6 * s); ctx.fill();
        break;
      }
      case 'pine': {
        ctx.fillStyle = 'rgba(20,26,18,0.18)';
        Art.ellipse(ctx, x, y, 18 * s, 7 * s); ctx.fill();
        ctx.fillStyle = '#5b3f27';
        Art.roundRect(ctx, x - 4 * s, y - 20 * s, 8 * s, 20 * s, 2 * s); ctx.fill(); Art.outline(ctx, 1.8);
        for (var k = 0; k < 3; k++) {
          ctx.fillStyle = k === 2 ? '#3d7a4e' : '#2f6b41';
          ctx.beginPath();
          ctx.moveTo(x, y - (62 - k * 4) * s + k * 14 * s);
          ctx.lineTo(x - (20 - k * 3) * s, y - (20 - k * 2) * s + k * 12 * s);
          ctx.lineTo(x + (20 - k * 3) * s, y - (20 - k * 2) * s + k * 12 * s);
          ctx.closePath(); ctx.fill(); Art.outline(ctx, 1.8);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.beginPath();
        ctx.moveTo(x, y - 62 * s); ctx.lineTo(x - 7 * s, y - 44 * s); ctx.lineTo(x + 7 * s, y - 44 * s);
        ctx.closePath(); ctx.fill();
        break;
      }
      case 'cactus': {
        ctx.fillStyle = 'rgba(60,50,20,0.2)';
        Art.ellipse(ctx, x, y, 14 * s, 6 * s); ctx.fill();
        ctx.fillStyle = '#4f9a5e';
        Art.roundRect(ctx, x - 7 * s, y - 52 * s, 14 * s, 52 * s, 7 * s); ctx.fill(); Art.outline(ctx, 2);
        Art.roundRect(ctx, x - 20 * s, y - 40 * s, 13 * s, 9 * s, 4.5 * s); ctx.fill(); Art.outline(ctx, 2);
        Art.roundRect(ctx, x + 7 * s, y - 32 * s, 13 * s, 9 * s, 4.5 * s); ctx.fill(); Art.outline(ctx, 2);
        break;
      }
      case 'fence': {
        ctx.fillStyle = '#8a5a33';
        Art.roundRect(ctx, x - 4 * s, y - 34 * s, 8 * s, 34 * s, 2 * s); ctx.fill(); Art.outline(ctx, 1.8);
        Art.roundRect(ctx, x - 22 * s, y - 26 * s, 44 * s, 6 * s, 2 * s); ctx.fill(); Art.outline(ctx, 1.6);
        Art.roundRect(ctx, x - 22 * s, y - 14 * s, 44 * s, 6 * s, 2 * s); ctx.fill(); Art.outline(ctx, 1.6);
        break;

  function viewOf(facing) {
    var sy = Math.sin(facing), sx = Math.cos(facing);
    if (Math.abs(sy) > 0.55) return { dir: sy > 0 ? 'down' : 'up', flip: false };
    return { dir: 'side', flip: sx < 0 };
  }
  /* a 4-step walk cycle: contact, left lift, contact, right lift */
  function walkFrame(phase, moving) {
    if (!moving) return 0;
    return [0, 1, 0, 2][Math.floor(phase) % 4];
  }
  E.viewOf = viewOf;
  E.walkFrame = walkFrame;

  /* ================================================================= PLAYER */
  function Player(stats, weaponId, world) {
    this.world = world;
    this.stats = stats;
    this.x = 0; this.y = 0; this.z = 0;
    this.vx = 0; this.vy = 0;
    this.radius = 15;
    this.facing = -Math.PI / 2;
    this.hp = stats.maxHp;
    this.stamina = stats.maxStamina;
    this.staminaLock = 0;
    this.weaponId = weaponId;
    this.animPhase = 0;
    this.moving = false;
    this.hurtFlash = 0;
    this.invuln = 0;
    this.dodgeCd = 0;
    this.dodgeTime = 0;
    this.atkState = null;
    this.atkKind = null;
    this.atkDef = null;
    this.atkTime = 0;
    this.specialCd = 0;
    this.hidden = false;
    this.hideAmount = 0;
    this.carrying = null;
    this.dead = false;
    this.lean = 0;
    this.drawScale = 1;
    this.smokeTimer = 0;
    this.damageTaken = 0;
    this.kills = 0;
    this.swingDir = 1;            /* flips each swing: left-to-right, then back */
  }

  Player.prototype.canAct = function () {
    return !this.dead && this.dodgeTime <= 0 && !this.atkState;
  };

  Player.prototype.moveScale = function () {
    if (this.atkState) {
      var w = D.WEAPONS[this.weaponId];
      return w.moveScale * (this.atkState === 'windup' ? 0.6 : 1);
    }
    return 1;
  };

  Player.prototype.update = function (dt, input) {
    if (this.dead) return;
    var w = this.world;

    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    this.dodgeCd = Math.max(0, this.dodgeCd - dt);
    this.specialCd = Math.max(0, this.specialCd - dt);
    this.staminaLock = Math.max(0, this.staminaLock - dt);
    this.smokeTimer = Math.max(0, this.smokeTimer - dt);

    if (this.staminaLock <= 0 && this.stamina < this.stats.maxStamina) {
      this.stamina = Math.min(this.stats.maxStamina, this.stamina + this.stats.staminaRegen * dt);
    }

    /* ------- dodge / glide ------- */
    if (this.dodgeTime > 0) {
      this.dodgeTime -= dt;
      var dodgeSpeed = this.stats.dodgeDist / 0.2;
      this.x += Math.cos(this.dodgeAngle) * dodgeSpeed * dt;
      this.y += Math.sin(this.dodgeAngle) * dodgeSpeed * dt;
      this.z = this.stats.glide ? Math.sin((1 - this.dodgeTime / 0.2) * Math.PI) * 18 : 0;
      this.moving = true;
      this.animPhase += dt * 18;
      w.confine(this);
      return;
    }
    this.z = 0;

    /* ------- movement ------- */
    var mv = input.move;
    var sc = this.moveScale();
    if (mv.mag > 0.08) {
      var sp = this.stats.speed * mv.mag * sc;
      this.x += mv.x * sp * dt;
      this.y += mv.y * sp * dt;
      this.moving = true;
      if (!this.atkState) this.facing = Math.atan2(mv.y, mv.x);
      this.animPhase += dt * (9 + 14 * mv.mag);
    } else {
      this.moving = false;
      this.animPhase += dt * 2.2;
    }
    w.confine(this);

    /* ------- attack state machine ------- */
    if (this.atkState) {
      this.atkTime += dt;
      if (this.atkState === 'windup' && this.atkTime >= this.atkDef.windup) {
        this.resolveAttack();
        this.atkState = 'recover';
        this.atkTime = 0;
      } else if (this.atkState === 'recover' && this.atkTime >= this.atkDef.recover) {
        this.atkState = null;
        this.atkDef = null;
      }
    }

    /* ------- hiding (GDD 7.3) ------- */
    var wasHidden = this.hidden;
    var inBush = w.inCover(this.x, this.y);
    this.hidden = !!inBush && !this.atkState && mv.mag < 0.75;
    this.hideAmount = U.approach(this.hideAmount, this.hidden ? 1 : 0, dt * 5);
    if (this.hidden && !wasHidden) w.onHide && w.onHide();
  };

  Player.prototype.attackDuration = function () {
    return this.atkDef ? this.atkDef.windup + this.atkDef.recover : 0.3;
  };

  /* Soft lock-on: on the swing, snap to the most plausible target in a wide
     cone. There is no held lock — you still aim with the stick — but a target
     that reads as "in front of me" now counts as in front of you. */
  Player.prototype.aimAssist = function (def) {
    var world = this.world;
    var SQ = Art.SQUASH;
    var reach = Math.min(def.range || 100, 260) + 55;
    var fv = Math.atan2(Math.sin(this.facing) * SQ, Math.cos(this.facing));
    var best = null, bestCost = Infinity;

    for (var i = 0; i < world.enemies.length; i++) {
      var e = world.enemies[i];
      if (e.dead || e.hiding) continue;
      var dx = e.x - this.x, dy = e.y - this.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > reach + e.radius) continue;
      var delta = Math.abs(U.angleDelta(fv, Math.atan2(dy * SQ, dx)));
      if (delta > 1.0) continue;                 /* ~57 degrees either side */
      var cost = delta * 90 + d * 0.35;          /* prefer aligned, then near */
      if (cost < bestCost) { bestCost = cost; best = e; }
    }
    if (best) this.facing = Math.atan2(best.y - this.y, best.x - this.x);
  };

  Player.prototype.tryAttack = function (special) {
    if (!this.canAct()) return false;
    var w = D.WEAPONS[this.weaponId];
    var def = special ? w.special : w;
    if (special && this.specialCd > 0) return false;
    if (this.stamina < def.stamina) { Audio.play('deny'); return false; }
    this.aimAssist(def);
    this.stamina -= def.stamina;
    this.staminaLock = 0.55;
    this.atkDef = def;
    this.atkKind = special ? 'special' : 'primary';
    this.atkState = 'windup';
    this.atkTime = 0;
    this.swingDir = -this.swingDir;
    if (special) this.specialCd = def.cooldown;
    Audio.play(w.kind === 'ranged' ? 'bow' : (w.id === 'battleaxe' ? 'heavy' : 'swing'));

    if (def.dash) {
      this.dodgeAngle = this.facing;
      this.x += Math.cos(this.facing) * def.dash * 0.35;
      this.y += Math.sin(this.facing) * def.dash * 0.35;
      this.world.confine(this);
    }
    return true;
  };

  Player.prototype.resolveAttack = function () {
    var w = D.WEAPONS[this.weaponId];
    var def = this.atkDef;
    var world = this.world;
    var mul = this.stats.damageMul * (w.kind === 'ranged' ? this.stats.rangedMul : 1);
    var dmg = def.damage * mul;

    if (w.kind === 'ranged') {
      var shots = def.shots || 1;
      var spread = def.spread || 0;
      for (var i = 0; i < shots; i++) {
        var a = this.facing + (shots > 1 ? (i - (shots - 1) / 2) * spread : 0);
        world.spawnArrow(this.x, this.y, a, def.projectileSpeed || w.projectileSpeed,
          dmg, w.range, this.stats.pierce);
      }
      return;
    }

    var halfArc = (def.spin ? Math.PI : def.arc / 2);
    var hitAny = false;
    for (var e = 0; e < world.enemies.length; e++) {
      var en = world.enemies[e];
      if (en.dead) continue;
      if (!U.inArcVisual(this.x, this.y, this.facing, halfArc, def.range + en.radius,
        en.x, en.y, Art.SQUASH)) continue;
      en.hurt(dmg, this.facing, def.knock || 120, this);
      hitAny = true;
      if (def.lifesteal) this.heal(dmg * def.lifesteal);
    }
    /* physical puzzle blocks can be knocked by melee too */
    world.meleeProps && world.meleeProps(this, halfArc, def.range);

    world.swipe(this.x, this.y, this.facing, def.range, halfArc, w.id);
    if (def.quake) world.shake(9, 0.35);
    if (hitAny) { Audio.play('hit'); world.shake(4, 0.12); }
  };

  Player.prototype.tryDodge = function () {
    if (this.dead || this.atkState || this.dodgeTime > 0 || this.dodgeCd > 0) return false;
    if (this.stamina < 16) { Audio.play('deny'); return false; }
    this.stamina -= 16;
    this.staminaLock = 0.5;
    var mv = this.world.input.move;
    this.dodgeAngle = mv.mag > 0.15 ? Math.atan2(mv.y, mv.x) : this.facing;
    this.facing = this.dodgeAngle;
    this.dodgeTime = 0.2;
    this.dodgeCd = 0.58 * this.stats.dodgeCdMul;
    this.invuln = Math.max(this.invuln, 0.3);
    Audio.play('dodge');
    this.world.dust(this.x, this.y, 6);
    return true;
  };

  Player.prototype.heal = function (n) {
    this.hp = Math.min(this.stats.maxHp, this.hp + n);
  };

  Player.prototype.hurt = function (dmg, fromAngle) {
    if (this.dead || this.invuln > 0 || this.dodgeTime > 0) return false;
    if (Math.random() < this.stats.evasion) {
      this.world.floater(this.x, this.y - 40, 'miss', '#cfe8ff');
      return false;
    }
    var real = dmg * this.stats.defenceMul;
    this.hp -= real;
    this.damageTaken += real;
    this.hurtFlash = 0.45;
    this.invuln = 0.6;
    this.x += Math.cos(fromAngle) * 20;
    this.y += Math.sin(fromAngle) * 20;
    this.world.confine(this);
    this.world.shake(7, 0.22);
    this.world.floater(this.x, this.y - 44, '-' + Math.round(real), '#ff7a7a');
    Audio.play('hurt');
    if (this.hp <= 0) { this.hp = 0; this.dead = true; }
    return true;
  };

  Player.prototype.draw = function (ctx, t) {
    var Px = V.Px, Spr = V.Spr;
    var view = viewOf(this.facing);
    var frame = walkFrame(this.animPhase, this.moving);
    var spr = Spr.player(view.dir, frame, this.tint);
    var y = this.sy - (this.z || 0) * 0.26;

    Px.shadow(ctx, this.sx, this.sy, 7, this.z > 2 ? 0.16 : 0.28);

    /* weapon sits behind the body when the swing goes away from camera */
    var wpn = Spr.weapon(this.weaponId);
    var Z = V.Trial.ZOOM, SQ = Art.SQUASH;

    /* The weapon travels a real arc AROUND the body: it winds back during the
       wind-up, then whips through the full sweep, alternating direction each
       swing. The sweep matches the weapon's hit arc, so what you see is what
       connects. */
    var sweepHalf = 0.55, orbit = -0.7, held = true;
    if (this.atkState && this.atkDef) {
      var def = this.atkDef;
      sweepHalf = (def.spin ? Math.PI : def.arc / 2) + 0.3;
      var dir = this.swingDir;
      if (this.atkState === 'windup') {
        /* wind back past the start of the arc */
        var wp = U.clamp(this.atkTime / Math.max(def.windup, 0.01), 0, 1);
        orbit = -sweepHalf * dir * (0.7 + 0.3 * wp);
      } else {
        var rp = U.clamp(this.atkTime / Math.max(def.recover, 0.01), 0, 1);
        orbit = U.lerp(-sweepHalf, sweepHalf, U.easeOut(rp)) * dir;
      }
      held = false;
    }

    var swingAngle = this.facing + orbit;
    var radius = held ? 7 : 12;
    var wx = this.sx + Math.cos(swingAngle) * radius;
    var wy = y - 13 + Math.sin(swingAngle) * radius * SQ;
    /* point the blade outward along the arc; the sprite pivots at its grip */
    var visual = Math.atan2(Math.sin(swingAngle) * SQ, Math.cos(swingAngle));
    var wOpts = { rot: view.flip ? Math.PI - visual : visual, flip: view.flip };
    var behind = Math.sin(swingAngle) < -0.15;

    if (behind) Px.draw(ctx, wpn, wx, wy, wOpts);
    var flash = this.hurtFlash > 0 && Math.floor(this.hurtFlash * 24) % 2 === 0;
    Px.draw(ctx, spr, this.sx, y, { flip: view.flip, alpha: flash ? 0.45 : null });
    if (!behind) Px.draw(ctx, wpn, wx, wy, wOpts);

    if (this.hidden) {
      ctx.fillStyle = 'rgba(120,200,140,0.22)';
      ctx.beginPath();
      ctx.ellipse(this.sx, y - 13, 12, 15, 0, 0, U.TAU);
      ctx.fill();
    }
    if (this.invuln > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.2 + 0.2 * Math.sin(t * 22)) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(this.sx, this.sy, 10, 5, 0, 0, U.TAU);
      ctx.stroke();
    }
  };

  /* ================================================================= ENEMY */
  function Enemy(defId, x, y, world, opts) {
    opts = opts || {};
    var def = D.ENEMIES[defId];
    this.def = def;
    this.id = defId;
    this.world = world;
    this.x = x; this.y = y; this.z = 0;
    this.radius = def.radius;
    this.maxHp = def.hp * (opts.hpScale || 1);
    this.hp = this.maxHp;
    this.damage = def.damage * (opts.dmgScale || 1);
    this.speed = def.speed * (opts.speedScale || 1);
    this.facing = Math.random() * U.TAU;
    this.state = 'idle';
    this.stateTime = 0;
    this.animPhase = Math.random() * 6;
    this.moving = false;
    this.hurtFlash = 0;
    this.dead = false;
    this.drawScale = 1;
    this.vx = 0; this.vy = 0;
    this.wanderAngle = Math.random() * U.TAU;
    this.wanderTimer = 0;
    this.hiding = !!opts.hiding;      /* seek trials: sits in cover until found */
    this.homeX = x; this.homeY = y;
    this.leash = opts.leash || 0;
    this.aggro = false;
    this.summonedAt = [];
    this.phase = 1;
    this.attackedThisSwing = false;
  }

  Enemy.prototype.detects = function (p) {
    if (p.dead) return false;
    if (p.smokeTimer > 0) return false;
    var sight = this.def.sight * p.stats.stealthMul;
    if (p.hidden) sight *= 0.22;
    return U.dist2(this.x, this.y, p.x, p.y) < sight * sight;
  };

  Enemy.prototype.update = function (dt) {
    if (this.dead) return;
    var w = this.world, p = w.player;
    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    this.stateTime += dt;

    /* knockback velocity decay */
    if (this.vx || this.vy) {
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.vx *= Math.pow(0.02, dt); this.vy *= Math.pow(0.02, dt);
      if (Math.abs(this.vx) < 6) this.vx = 0;
      if (Math.abs(this.vy) < 6) this.vy = 0;
      w.confine(this);
    }

    if (this.hiding) {
      this.moving = false;
      this.animPhase += dt * 1.5;
      /* found if the player gets very close */
      if (U.dist2(this.x, this.y, p.x, p.y) < 118 * 118) {
        this.hiding = false;
        this.aggro = true;
        this.state = 'chase';
        w.floater(this.x, this.y - 40, 'found!', '#ffe45c');
        w.onEnemyFound && w.onEnemyFound(this);
      }
      return;
    }

    var d = U.dist(this.x, this.y, p.x, p.y);
    var toP = Math.atan2(p.y - this.y, p.x - this.x);

    if (this.def.boss) this.bossBrain(dt, d, toP, p);

    switch (this.state) {
      case 'idle': {
        this.wanderTimer -= dt;
        if (this.wanderTimer <= 0) {
          this.wanderTimer = 1 + Math.random() * 2.2;
          this.wanderAngle = Math.random() * U.TAU;
          this.wanderMoving = Math.random() < 0.6;
        }
        if (this.wanderMoving) {
          this.step(this.wanderAngle, this.speed * 0.34, dt);
          this.moving = true;
        } else this.moving = false;
        if (this.detects(p)) { this.state = 'chase'; this.stateTime = 0; this.aggro = true; }
        break;
      }
      case 'chase': {
        this.facing = toP;
        this.moving = true;
        var chaseSpeed = this.speed;
        if (this.def.charge && d > 220 && d < 620 && this.stateTime > 1.0) {
          this.state = 'charge'; this.stateTime = 0;
          this.chargeAngle = toP;
          w.floater(this.x, this.y - 46, '!', '#ff6a3c');
          break;
        }
        this.step(toP, chaseSpeed, dt);
        if (d < this.def.attackRange) { this.state = 'windup'; this.stateTime = 0; this.attackedThisSwing = false; }
        else if (!this.detects(p) && this.stateTime > 2.5) { this.state = 'idle'; this.stateTime = 0; }
        break;
      }
      case 'charge': {
        this.moving = true;
        this.facing = this.chargeAngle;
        this.step(this.chargeAngle, this.speed * 2.3, dt);
        if (d < this.def.attackRange * 0.8) {
          if (p.hurt(this.damage * 1.2, this.chargeAngle)) w.shake(10, 0.3);
          this.state = 'recover'; this.stateTime = 0;
        }
        if (this.stateTime > 0.9) { this.state = 'recover'; this.stateTime = 0; }
        break;
      }
      case 'windup': {
        this.moving = false;
        this.facing = U.lerp(this.facing, this.facing + U.angleDelta(this.facing, toP), 0.18);
        if (this.stateTime >= this.def.attackWindup) {
          this.swing(p);
          this.state = 'recover'; this.stateTime = 0;
        }
        break;
      }
      case 'recover': {
        this.moving = false;
        if (this.stateTime >= this.def.attackRecover) {
          this.state = d < this.def.sight ? 'chase' : 'idle';
          this.stateTime = 0;
        }
        break;
      }
      case 'stagger': {
        this.moving = false;
        if (this.stateTime > 0.45) { this.state = 'chase'; this.stateTime = 0; }
        break;
      }
    }
    this.animPhase += dt * (this.moving ? 15 : 2);
  };

  Enemy.prototype.step = function (angle, speed, dt) {
    var nx = this.x + Math.cos(angle) * speed * dt;
    var ny = this.y + Math.sin(angle) * speed * dt;
    this.x = nx; this.y = ny;
    this.world.confine(this);
  };

  Enemy.prototype.swing = function (p) {
    var w = this.world;
    var arc = this.def.boss ? 1.6 : 1.1;
    w.swipe(this.x, this.y, this.facing, this.def.attackRange, arc / 2, 'enemy');
    if (U.inArcVisual(this.x, this.y, this.facing, arc / 2, this.def.attackRange + p.radius,
      p.x, p.y, Art.SQUASH)) {
      p.hurt(this.damage, this.facing);
    }
    V.Audio.play(this.def.heavy || this.def.boss ? 'heavy' : 'swing');
  };

  Enemy.prototype.bossBrain = function (dt, d, toP, p) {
    var w = this.world;
    this.bossTimer = (this.bossTimer || 0) + dt;
    var hpFrac = this.hp / this.maxHp;

    /* phase gates: summon adds at 66% and 33% */
    var wantPhase = hpFrac > 0.66 ? 1 : (hpFrac > 0.33 ? 2 : 3);
    if (wantPhase > this.phase) {
      this.phase = wantPhase;
      var n = this.def.finalBoss ? 4 : 2;
      for (var i = 0; i < n; i++) {
        var a = Math.random() * U.TAU;
        w.spawnEnemy(this.def.finalBoss && i % 2 === 0 ? 'minotaur' : 'goblin',
          this.x + Math.cos(a) * 170, this.y + Math.sin(a) * 170);
      }
      w.floater(this.x, this.y - 70, 'RISE', '#ff4d5e');
      V.Audio.play('boss');
      w.shake(14, 0.5);
    }

    /* teleport out of a corner or when kited */
    if (this.def.teleport && this.bossTimer > (this.def.finalBoss ? 3.5 : 4.5) && d > 340) {
      this.bossTimer = 0;
      var ta = Math.atan2(this.y - p.y, this.x - p.x) + Math.PI;
      this.x = p.x + Math.cos(ta + (Math.random() - 0.5)) * 130;
      this.y = p.y + Math.sin(ta + (Math.random() - 0.5)) * 130;
      w.confine(this);
      w.burst(this.x, this.y, 18, '#9b6bff');
      V.Audio.play('warp');
      this.state = 'windup'; this.stateTime = 0;
    }

    /* final boss: radial feather volley */
    if (this.def.finalBoss) {
      this.volleyTimer = (this.volleyTimer || 0) + dt;
      if (this.volleyTimer > (this.phase >= 3 ? 2.6 : 4)) {
        this.volleyTimer = 0;
        var shots = 8 + this.phase * 2;
        for (var s = 0; s < shots; s++) {
          w.spawnBolt(this.x, this.y - 20, (s / shots) * U.TAU + this.bossTimer, 280, this.damage * 0.45);
        }
        V.Audio.play('warp');
      }
    }
  };

  Enemy.prototype.hurt = function (dmg, fromAngle, knock, src) {
    if (this.dead) return;
    this.hiding = false;
    this.hp -= dmg;
    this.hurtFlash = 0.18;
    this.aggro = true;
    var resist = this.def.boss ? 0.25 : (this.def.heavy ? 0.5 : 1);
    this.vx += Math.cos(fromAngle) * knock * resist;
    this.vy += Math.sin(fromAngle) * knock * resist;
    this.world.floater(this.x, this.y - 36 - this.radius, String(Math.round(dmg)), '#fff0a8');
    this.world.burst(this.x, this.y - 18, 5, '#ffd66b');
    if (!this.def.boss && knock > 200) { this.state = 'stagger'; this.stateTime = 0; }
    if (this.state === 'idle') { this.state = 'chase'; this.stateTime = 0; }
    if (this.hp <= 0) this.die(src);
  };

  Enemy.prototype.die = function (src) {
    this.dead = true;
    this.hp = 0;
    var w = this.world;
    w.burst(this.x, this.y - 18, 16, this.def.colour);
    V.Audio.play('kill');
    if (src) src.kills++;
    w.onEnemyKilled && w.onEnemyKilled(this);
  };

  var ENEMY_SPRITE = { goblin: 'goblin', minotaur: 'minotaur', reaper: 'reaper', aurelith: 'aurelith' };

  Enemy.prototype.draw = function (ctx, t) {
    if (this.dead) return;
    var Px = V.Px, Spr = V.Spr, Z = V.Trial.ZOOM;
    var view = viewOf(this.facing);
    var frame = walkFrame(this.animPhase, this.moving);
    var name = ENEMY_SPRITE[this.id];
    var spr = this.id === 'aurelith' ? Spr.aurelith(frame ? 1 : 0) : Spr[name](view.dir, frame);
    var y = this.sy - (this.z || 0) * Z;

    var alpha = null;

  };

  /* ------------------------------------------------------------ pushing
     Pushing locks to one cardinal axis and pins the player square behind the
     stone, so an off-centre joystick can no longer slide you past it. */
  Trial.prototype.updatePush = function (dt) {
    if (!this.blocks.length) return;
    var p = this.player;
    var mv = this.input.move;
    var PUSH_SPEED = 115;
    var i;

    /* release the lock when you stop, turn away, or get separated */
    if (this.push) {
      var pb = this.push.block;
      var held = this.push.axis === 'x' ? mv.x : mv.y;
      var stillOn = mv.mag > 0.2 && held * this.push.dir > 0.3;
      var near = U.dist(p.x, p.y, pb.x, pb.y) < pb.r + p.radius + 30;
      if (!stillOn || !near || p.atkState || p.dodgeTime > 0) this.push = null;
    }

    /* acquire: must be touching the stone and moving into it */
    if (!this.push && mv.mag > 0.25 && !p.atkState && p.dodgeTime <= 0) {
      for (i = 0; i < this.blocks.length; i++) {
        var b = this.blocks[i];
        if (U.dist(p.x, p.y, b.x, b.y) > b.r + p.radius + 6) continue;
        var toBlock = Math.atan2(b.y - p.y, b.x - p.x);
        if (Math.abs(U.angleDelta(Math.atan2(mv.y, mv.x), toBlock)) > 1.0) continue;
        var axis = Math.abs(b.x - p.x) > Math.abs(b.y - p.y) ? 'x' : 'y';
        var dir = axis === 'x' ? (b.x > p.x ? 1 : -1) : (b.y > p.y ? 1 : -1);
        this.push = { block: b, axis: axis, dir: dir };
        break;
      }
    }
    if (!this.push) return;

    var blk = this.push.block, ax = this.push.axis, dr = this.push.dir;
    var gap = blk.r + p.radius;

    if (ax === 'x') blk.x += dr * PUSH_SPEED * dt;
    else blk.y += dr * PUSH_SPEED * dt;
    U.confineToCircle(blk, 0, 0, ARENA_R - 60);

    /* pin the player square behind the stone and slide them onto its centre line */
    if (ax === 'x') {
      p.x = blk.x - dr * gap;
      p.y = U.approach(p.y, blk.y, 260 * dt);
      p.facing = dr > 0 ? 0 : Math.PI;
    } else {
      p.y = blk.y - dr * gap;
      p.x = U.approach(p.x, blk.x, 260 * dt);
      p.facing = dr > 0 ? Math.PI / 2 : -Math.PI / 2;
    }
    p.moving = true;
    this.confine(p);
  };

  Trial.prototype.setMessage = function (txt, time) {
    this.message = txt;
    this.messageTime = time || 2.2;
  };

  Trial.prototype.updateObjective = function (dt) {
    var p = this.player, i;

    switch (this.type) {
      case 'boss': {
        if (this.boss.dead || this.enemies.indexOf(this.boss) < 0) this.objectiveDone = true;
        break;
      }
      case 'defeat': {
        /* trickle in the remainder */
        if (this.remainingToSpawn > 0 && this.enemies.length < 6) {
          var sp = this.randomPoint(ARENA_R * 0.5, ARENA_R - 120, 380);
          this.spawnEnemy(this.pickEnemy(this.tier(), this.rng), sp.x, sp.y, this.scaleOpts);
          this.remainingToSpawn--;
        }
        if (this.kills >= this.target) this.objectiveDone = true;
        break;
      }
      case 'defend': {
        this.waveTimer -= dt;
        if (this.waveTimer <= 0) {
          this.waveTimer = Math.max(1.6, 5.2 - this.tier() * 0.9);
          var n = 1 + Math.floor(this.tier());
          for (i = 0; i < n; i++) {
            var a = Math.random() * U.TAU;
            this.spawnEnemy(this.pickEnemy(this.tier(), this.rng),
              Math.cos(a) * (ARENA_R - 60), Math.sin(a) * (ARENA_R - 60), this.scaleOpts);
          }
        }
        /* enemies inside the zone chew on it */
        for (i = 0; i < this.enemies.length; i++) {
          var e = this.enemies[i];
          if (U.dist2(e.x, e.y, this.zone.x, this.zone.y) < this.zone.r * this.zone.r) {
            this.zone.hp -= 7 * dt;
          }
        }
        if (this.zone.hp <= 0) { this.zone.hp = 0; this.objectiveFailed = true; }
        break;
      }
      case 'deliver': {
        if (!this.relic.taken && U.dist2(p.x, p.y, this.relic.x, this.relic.y) < 58 * 58) {
          this.relic.taken = true;
          p.carrying = 'relic';
          Audio.play('pickup');
          this.setMessage('Relic taken - get it to the marker');
        }
        if (this.relic.taken && U.dist2(p.x, p.y, this.delivery.x, this.delivery.y) < this.delivery.r * this.delivery.r) {
          this.objectiveDone = true;
        }
        break;
      }
      case 'puzzle': {
        var solved = 0;
        for (i = 0; i < this.plates.length; i++) {
          var pl = this.plates[i];
          pl.filled = false;
          for (var b = 0; b < this.blocks.length; b++) {
            if (U.dist2(this.blocks[b].x, this.blocks[b].y, pl.x, pl.y) < pl.r * pl.r) { pl.filled = true; break; }
          }
          if (pl.filled) solved++;
        }
        if (solved !== this.lastSolved) {
          if (solved > (this.lastSolved || 0)) Audio.play('confirm');
          this.lastSolved = solved;
        }
        if (solved >= this.plates.length) this.objectiveDone = true;
        break;
      }
      case 'word': {
        for (i = 0; i < this.hints.length; i++) {
          var h = this.hints[i];
          if (!h.found && U.dist2(p.x, p.y, h.x, h.y) < 62 * 62) {
            h.found = true;
            this.riddle.revealed++;
            Audio.play('pickup');
            this.setMessage('Hint ' + this.riddle.revealed + '/3 found');
          }
        }
        if (this.riddle.answered) {
          if (this.riddle.correct) this.objectiveDone = true;
          else this.objectiveFailed = true;
        }
        break;
      }
      case 'hide': {
        var spotted = false;
        for (i = 0; i < this.enemies.length; i++) {
          if (this.enemies[i].state === 'chase' || this.enemies[i].state === 'windup' ||
              this.enemies[i].state === 'charge') { spotted = true; break; }
        }
        if (spotted) this.spottedTime += dt;
        this.spotted = spotted;
        break;
      }
      case 'seek': {
        var left = 0;
        for (i = 0; i < this.enemies.length; i++) if (!this.enemies[i].dead) left++;
        this.enemiesLeft = left;
        if (left === 0) this.objectiveDone = true;
        break;
      }
    }
  };

  Trial.prototype.useConsumable = function () {
    var g = this.game;
    if (this.consumables.potion > 0 && this.player.hp < this.stats.maxHp * 0.75) {
      this.consumables.potion--; g.spendConsumable('c_potion');
      this.player.heal(50); Audio.play('pickup');
      this.floater(this.player.x, this.player.y - 50, '+50', '#7fe08a');
      return;
    }
    if (this.consumables.tonic > 0 && this.player.stamina < this.stats.maxStamina * 0.5) {
      this.consumables.tonic--; g.spendConsumable('c_tonic');
      this.player.stamina = this.stats.maxStamina; Audio.play('pickup');
      return;
    }
    if (this.consumables.smoke > 0) {
      this.consumables.smoke--; g.spendConsumable('c_smoke');
      this.player.smokeTimer = 6;
      for (var i = 0; i < this.enemies.length; i++) {
        this.enemies[i].state = 'idle'; this.enemies[i].stateTime = 0;
      }
      this.burst(this.player.x, this.player.y, 26, 'rgba(220,220,230,0.9)');
      Audio.play('dodge');
      this.setMessage('Smoke - they lost you');
      return;
    }
    Audio.play('deny');
  };

  Trial.prototype.answerRiddle = function (choice) {
    if (!this.riddle || this.riddle.answered) return;
    this.riddle.answered = true;
    this.riddle.correct = (choice === this.riddle.answer);
    Audio.play(this.riddle.correct ? 'confirm' : 'deny');
  };

  Trial.prototype.nearAnswerPad = function () { return !!this.riddle; };

  /* ================================================================ scoring */
  /* Per-type scoring weights. Puzzles deliberately lean on completing cleanly
     rather than on raw speed: `time` is small and `flawless` rewards taking no
     damage, so knowing the layout and doing it carefully beats sprinting. */
  var SCORE = {
    defeat:  { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    defend:  { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    deliver: { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    seek:    { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    hide:    { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    boss:    { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    puzzle:  { complete: 0.92, time: 0.50, kill: 16, damage: 0.90, flawless: 0.10 },
    word:    { complete: 0.92, time: 0.45, kill: 16, damage: 0.90, flawless: 0.10 }
  };

  Trial.prototype.finish = function (reason) {
    if (this.state === 'done') return;
    this.state = 'done';
    Audio.music(null);

    var w = SCORE[this.type] || SCORE.defeat;
    var score = 0;
    var timeBonus = Math.max(0, this.timeLeft) * w.time;
    var killScore = this.kills * w.kill;
    var damagePenalty = this.player.damageTaken * w.damage;

    var completed = (reason === 'complete');
    if (completed) {
      score += this.par * w.complete;
      score += timeBonus;
      /* care, not speed: finishing untouched is worth as much as a fast run */
      if (w.flawless && this.player.damageTaken <= 0) score += this.par * w.flawless;
    }
    score += killScore;

    if (this.type === 'hide') {
      /* rewarded for staying unseen, not for kills */
      var unseen = Math.max(0, this.timeLimit - this.spottedTime);
      score = (completed ? this.par * 0.62 : 0) + unseen * 5 + killScore * 0.5;
    }
    if (this.type === 'defend' && completed) {
      score += (this.zone.hp / this.zone.maxHp) * this.par * 0.22;
    }
    if (this.type === 'puzzle') {
      /* stones already set count even if the clock beats you */
      var set = 0;
      for (var pl = 0; pl < this.plates.length; pl++) if (this.plates[pl].filled) set++;
      if (!completed) score += (set / Math.max(1, this.plates.length)) * this.par * 0.35;
    }
    if (this.type === 'word') {
      if (completed) {
        /* answering on fewer hints is a real gamble, and pays for it */
        score += (3 - this.riddle.revealed) * this.par * 0.06;
      } else {
        score += (this.riddle.revealed / 3) * this.par * 0.2;
      }
    }
    if (this.type === 'boss' && completed) {
      score += this.boss ? this.boss.maxHp * 0.3 : 0;
    }

    score -= damagePenalty;
    if (reason === 'death') score = Math.min(score, this.par * 0.2);
    if (reason === 'timeout' || reason === 'objective') score = Math.min(score, this.par * 0.55);
    score = Math.max(0, Math.round(score));

    /* GDD 6.2: ratio 1.0 => top 25%, 0.8 => 40% boundary */
    var ratio = score / Math.max(1, this.par);
    var percentile = U.clamp(Math.round(100 - 75 * ratio), 1, 99);
    if (reason === 'death') percentile = Math.max(percentile, 62);

    var tier = D.RANK_TIERS[2];
    for (var i = 0; i < D.RANK_TIERS.length; i++) {
      if (percentile <= D.RANK_TIERS[i].max) { tier = D.RANK_TIERS[i]; break; }
    }

    this.result = {
      reason: reason,
      completed: completed,
      score: score,
      par: Math.round(this.par),
      percentile: percentile,
      tier: tier,
      kills: this.kills,
      timeLeft: Math.max(0, this.timeLeft),
      damageTaken: Math.round(this.player.damageTaken),
      bonusCoins: this.bonusCoins || 0,
      died: reason === 'death',
      trial: this.spec
    };
    Audio.play(tier.outcome === 'fail' ? 'lose' : 'win');
    this.game.onTrialFinished(this.result);
  };

  /* ================================================================= render
     Everything below works in BUFFER PIXELS, not world units. ZOOM converts
     between them, and it is fixed so one sprite pixel is always one buffer
     pixel - which is what stops pixel art from shimmering as you move. */
  var ZOOM = 0.26;

  Trial.prototype.render = function (ctx, cw, ch) {
    var p = this.player;
    var Px = V.Px, Spr = V.Spr;

    /* camera lead + smoothing, in world units */
    var lead = 175;
    var tx = p.x + Math.cos(p.facing) * lead * 0.35;
    var ty = p.y + Math.sin(p.facing) * lead * 0.35;
    this.cam.x = U.lerp(this.cam.x, tx, 0.2);
    this.cam.y = U.lerp(this.cam.y, ty, 0.2);

    var shakeX = 0, shakeY = 0;
    if (this.shakeTime > 0) {
      shakeX = Math.round((Math.random() - 0.5) * this.shakeAmt * ZOOM * 2);
      shakeY = Math.round((Math.random() - 0.5) * this.shakeAmt * ZOOM * 2);
    }

    ctx.fillStyle = this.env.sky;
    ctx.fillRect(0, 0, cw, ch);

    this._originX = Math.round(cw / 2) + shakeX;
    this._originY = Math.round(ch / 2) + shakeY;

    ctx.save();
    ctx.translate(this._originX, this._originY);

    var self = this;
    function P(x, y) {
      return { x: Math.round((x - self.cam.x) * ZOOM), y: Math.round((y - self.cam.y) * Art.SQUASH * ZOOM) };
    }
    this.project = P;
    this.screenFloaters = [];

    this.drawGround(ctx, P, cw, ch);

    /* cull to the visible box, with a margin for tall sprites */
    var halfW = cw / 2 + 60, halfH = ch / 2 + 80;
    function visible(sp) { return Math.abs(sp.x) < halfW && Math.abs(sp.y) < halfH; }

    var list = [];
    var i;

    for (i = 0; i < this.props.length; i++) {
      var pr = this.props[i];
      var sp = P(pr.x, pr.y);
      if (!visible(sp)) continue;
      list.push({ y: pr.y, spr: Spr.prop(pr.kind, pr.seed), x: sp.x, sy: sp.y });
    }
    for (i = 0; i < this.cover.length; i++) {
      var cv = this.cover[i];
      var sc = P(cv.x, cv.y);
      if (!visible(sc)) continue;
      list.push({ y: cv.y, spr: Spr.prop(cv.kind, cv.seed), x: sc.x, sy: sc.y });
    }
    for (i = 0; i < this.blocks.length; i++) {
      var bl = this.blocks[i];
      var sb = P(bl.x, bl.y);
      if (!visible(sb)) continue;
      list.push({ y: bl.y, spr: Spr.prop('stone', i), x: sb.x, sy: sb.y });
    }

    for (i = 0; i < this.enemies.length; i++) {
      (function (e) {
        var s2 = P(e.x, e.y);
        e.sx = s2.x; e.sy = s2.y;
        if (!visible(s2)) return;
        list.push({ y: e.y, fn: function () { e.draw(ctx, self.t); } });
      })(this.enemies[i]);
    }
    (function (pl) {
      var s3 = P(pl.x, pl.y);
      pl.sx = s3.x; pl.sy = s3.y;
      list.push({ y: pl.y + 0.1, fn: function () { pl.draw(ctx, self.t); } });
    })(p);

    for (i = 0; i < this.projectiles.length; i++) {
      (function (pj) {
        var s4 = P(pj.x, pj.y);
        pj.sx = s4.x; pj.sy = s4.y - 6;
        for (var k = 0; k < pj.trail.length; k++) {
          var tp = P(pj.trail[k].x, pj.trail[k].y);
          pj.trail[k].sx = tp.x; pj.trail[k].sy = tp.y - 6;
        }
        list.push({ y: pj.y, fn: function () { pj.draw(ctx); } });
      })(this.projectiles[i]);
    }

    this.drawObjectiveGround(ctx, P);

    list.sort(function (a, b) { return a.y - b.y; });
    for (i = 0; i < list.length; i++) {
      var it = list[i];
      if (it.fn) it.fn();
      else Px.draw(ctx, it.spr, it.x, it.sy);
    }

    this.drawFx(ctx, P);
    this.drawObjectiveOverlay(ctx, P);

    ctx.restore();
  };

  Trial.prototype.drawGround = function (ctx, P, cw, ch) {
    var c = P(0, 0);
    var r = ARENA_R * ZOOM;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, r, r * Art.SQUASH, 0, 0, U.TAU);
    ctx.closePath();
    ctx.clip();

    ctx.fillStyle = this.env.ground;
    ctx.fillRect(c.x - r - 4, c.y - r - 4, r * 2 + 8, r * 2 + 8);

    /* the tiled floor, anchored to the world origin so it scrolls with the map */
    var pat = V.Spr.groundPattern(ctx, this.env.id);
    if (pat) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.fillStyle = pat;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.restore();
    }

    /* darken toward the tree line */
    var grd = ctx.createRadialGradient(c.x, c.y, r * 0.6, c.x, c.y, r);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(20,16,26,0.4)');
    ctx.fillStyle = grd;
    ctx.fillRect(c.x - r, c.y - r, r * 2, r * 2);
    ctx.restore();
  };

  Trial.prototype.drawObjectiveGround = function (ctx, P) {
    var t = this.t, i, sp;
    if (this.zone) {
      sp = P(this.zone.x, this.zone.y);
      var zr = this.zone.r * ZOOM;
      var frac = this.zone.hp / this.zone.maxHp;
      ctx.fillStyle = 'rgba(90,200,255,' + (0.12 + 0.05 * Math.sin(t * 2)) + ')';
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, zr, zr * Art.SQUASH, 0, 0, U.TAU);
      ctx.fill();
      ctx.strokeStyle = frac > 0.4 ? '#5ac8ff' : '#ff6a6a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, zr, zr * Art.SQUASH, 0, -Math.PI / 2, -Math.PI / 2 + U.TAU * frac);
      ctx.stroke();
    }
    if (this.delivery) {
      sp = P(this.delivery.x, this.delivery.y);
      var dr = this.delivery.r * ZOOM;
      ctx.strokeStyle = this.relic.taken ? '#7fe08a' : 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, dr, dr * Art.SQUASH, 0, 0, U.TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    for (i = 0; i < this.plates.length; i++) {
      sp = P(this.plates[i].x, this.plates[i].y);
      var pr2 = this.plates[i].r * ZOOM;
      ctx.fillStyle = this.plates[i].filled ? 'rgba(120,240,150,0.3)' : 'rgba(255,228,92,0.18)';
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, pr2, pr2 * Art.SQUASH, 0, 0, U.TAU);
      ctx.fill();
      ctx.strokeStyle = this.plates[i].filled ? '#7fe08a' : '#ffe45c';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  };

  Trial.prototype.drawObjectiveOverlay = function (ctx, P) {
    var Px = V.Px, Spr = V.Spr, t = this.t, sp, i;
    var bob = Math.round(Math.sin(t * 3) * 2);
    if (this.relic && !this.relic.taken) {
      sp = P(this.relic.x, this.relic.y);
      Px.shadow(ctx, sp.x, sp.y, 4, 0.2);
      Px.draw(ctx, Spr.prop('relic', 0), sp.x, sp.y - 4 + bob);
    }
    if (this.relic && this.relic.taken) {
      sp = P(this.player.x, this.player.y);
      Px.draw(ctx, Spr.prop('relic', 0), sp.x, sp.y - 30 + bob);
    }
    for (i = 0; i < this.hints.length; i++) {
      if (this.hints[i].found) continue;
      sp = P(this.hints[i].x, this.hints[i].y);
      Px.draw(ctx, Spr.prop('hint', 0), sp.x, sp.y - 2 + bob);
    }

    var target = null;
    if (this.relic && !this.relic.taken) target = this.relic;
    else if (this.delivery && this.relic && this.relic.taken) target = this.delivery;
    else if (this.zone) target = this.zone;
    if (target) this.drawGuide(ctx, P, target);
  };

  Trial.prototype.drawGuide = function (ctx, P, target) {
    var p = this.player;
    if (U.dist(p.x, p.y, target.x, target.y) < 330) return;
    var a = Math.atan2((target.y - p.y) * Art.SQUASH, target.x - p.x);
    var sp = P(p.x, p.y);
    ctx.save();
    ctx.translate(sp.x + Math.cos(a) * 22, sp.y - 14 + Math.sin(a) * 22);
    ctx.rotate(a);
    ctx.fillStyle = '#ffe45c';
    ctx.fillRect(0, -1, 5, 3);
    ctx.fillRect(4, -3, 2, 7);
    ctx.fillRect(6, -1, 2, 3);
    ctx.restore();
  };

  Trial.prototype.drawFx = function (ctx, P) {
    var i, sp;
    for (i = 0; i < this.swipes.length; i++) {
      var s = this.swipes[i];
      sp = P(s.x, s.y);
      var k = s.life / s.max;
      ctx.save();
      ctx.translate(sp.x, sp.y - 9);
      ctx.scale(1, Art.SQUASH);
      ctx.strokeStyle = s.kind === 'enemy' ? 'rgba(255,120,110,' + k * 0.8 + ')' : 'rgba(255,255,255,' + k * 0.85 + ')';
      ctx.lineWidth = Math.max(1, Math.round(3 * k + 1));
      ctx.beginPath();
      ctx.arc(0, 0, s.range * ZOOM * (1.05 - k * 0.25), s.angle - s.halfArc, s.angle + s.halfArc);
      ctx.stroke();
      ctx.restore();
    }
    for (i = 0; i < this.particles.length; i++) {
      var pt = this.particles[i];
      sp = P(pt.x, pt.y);
      ctx.globalAlpha = U.clamp(pt.life / pt.max, 0, 1);
      ctx.fillStyle = pt.colour;
      var pr = Math.max(1, Math.round(pt.r * 0.6));
      ctx.fillRect(sp.x - pr, sp.y - 8 - pr, pr * 2, pr * 2);
    }
    ctx.globalAlpha = 1;

    /* floating numbers are handed to the HUD so they stay crisp */
    for (i = 0; i < this.floaters.length; i++) {
      var f = this.floaters[i];
      sp = P(f.x, f.y);
      this.screenFloaters.push({
        x: sp.x, y: sp.y, text: f.text, colour: f.colour,
