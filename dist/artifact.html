      /* Once it has surfaced it does not go back in the box. This used to live
         on the scene instance, so leaving and coming back started another
         five-minute wait - the secret found you and then un-found you. */
      shown: !!game.save.comboSeen && !game.save.scytheUnlocked,
      combo: D.COMBOS[game.save.comboIndex % D.COMBOS.length]
    };
  };

  Secret.taken = function (scene) { return !!scene.game.save.scytheUnlocked; };

  /* `blocked` is the host saying something modal is over it - an install card,
     a shop, a dialogue - so the arrows are not stolen from it. */
  Secret.update = function (scene, dt, blocked) {
    var k = scene.secret, game = scene.game;
    k.flash = Math.max(0, k.flash - dt);
    if (Secret.taken(scene)) return;

    /* any interaction resets the idle clock */
    if (Input.anyInput && !k.shown) k.idle = 0;
    else k.idle += dt;

    if (!k.shown && k.idle >= game.idleUnlockSeconds) {
      k.shown = true;
      k.progress = 0;
      game.save.comboSeen = true;
      game.persist();
      Audio.play('warp');
    }

    /* Arrows are live whether or not the panel is up, so someone who KNOWS the
       sequence can just enter it. Gating input on the prompt made the secret
       worthless to know: you still had to sit through five minutes of nothing
       before the game would listen. Polled here rather than in the draw so it
       works with the panel closed - keyPressed is edge-triggered and cleared at
       the end of the frame, so one read per press either way. */
    if (!blocked) {
      if (Input.keyPressed.up) Secret.press(scene, 'up');
      if (Input.keyPressed.down) Secret.press(scene, 'down');
      if (Input.keyPressed.left) Secret.press(scene, 'left');
      if (Input.keyPressed.right) Secret.press(scene, 'right');
    }
  };

  Secret.press = function (scene, dir) {
    var k = scene.secret;
    if (Secret.taken(scene)) return;
    if (k.combo[k.progress] === dir) {
      k.progress++;
      Audio.play('confirm');
      if (k.progress >= k.combo.length) {
        scene.game.unlockScythe();
        k.shown = false;
        k.flash = 3.2;
        Audio.play('unlock');
      }
    } else {
      k.progress = 0;
      Audio.play('deny');
    }
  };

  /* the mark that reopens it. Found once is found: the five minutes only ever
     bought you knowing it was there. */
  Secret.drawMark = function (scene, ctx, x, y, s, t) {
    var k = scene.secret;
    if (k.shown || Secret.taken(scene) || !scene.game.save.comboSeen) return false;
    if (UI.button(ctx, 'cmb_open', x - 22 * s, y, 44 * s, 30 * s, '\u25C7',
                  { size: 17, fill: 'rgba(30,48,52,0.85)',
                    stroke: 'rgba(160,235,225,' + (0.35 + 0.25 * Math.sin(t * 2.2)) + ')' })) {
      k.shown = true;
      k.progress = 0;
      Audio.play('warp');
    }
    return true;
  };

  Secret.drawPanel = function (scene, ctx, cw, ch, s) {
    var k = scene.secret;
    UI.dim(ctx, cw, ch, 0.78);
    /* 322 rather than 300, and centred on that: the `later` button is 26 tall
       and sat at 288, so it hung through the panel's floor. */
    var w = Math.min(330 * s, cw - 30), x = cw / 2 - w / 2, y = ch * 0.5 - 161 * s;
    UI.panel(ctx, x, y, w, 322 * s, { fill: 'rgba(18,14,26,0.95)', stroke: 'rgba(200,240,235,0.5)' });

    UI.text(ctx, 'something is here', cw / 2, y + 26 * s,
      { size: 18, align: 'center', weight: '800', colour: '#c9f0ea' });

    var glyph = { up: '\u25B2', down: '\u25BC', left: '\u25C0', right: '\u25B6' };
    var gy = y + 62 * s;
    var step = Math.min(38 * s, (w - 40 * s) / k.combo.length);
    var startX = cw / 2 - (k.combo.length - 1) * step / 2;
    for (var i = 0; i < k.combo.length; i++) {
      UI.text(ctx, glyph[k.combo[i]], startX + i * step, gy, {
        size: 22, align: 'center',
        colour: i < k.progress ? '#7fe08a' : 'rgba(255,255,255,0.55)'
      });
    }

    var cx = cw / 2, cy = y + 175 * s, r = 34 * s, gap = 42 * s;
    function dirBtn(id, dx, dy, label) {
      if (UI.roundButton(ctx, id, cx + dx, cy + dy, r, label, { size: 18 })) {
        Secret.press(scene, id.replace('cmb_', ''));
      }
    }
    dirBtn('cmb_up', 0, -gap, '\u25B2');
    dirBtn('cmb_down', 0, gap, '\u25BC');
    dirBtn('cmb_left', -gap, 0, '\u25C0');
    dirBtn('cmb_right', gap, 0, '\u25B6');

    UI.text(ctx, 'enter it', cw / 2, y + 268 * s,
      { size: 12, align: 'center', colour: 'rgba(255,255,255,0.45)' });

    /* A way out that is not "wait another five minutes". Closing it only hides
       it for this visit - save.comboSeen keeps it found, so the mark brings it
       straight back. */
    if (UI.button(ctx, 'cmb_close', cw / 2 - 46 * s, y + 282 * s, 92 * s, 26 * s,
                  'later', { size: 12 })) {
      k.shown = false;
      k.progress = 0;
    }
  };

  /* ============================================================ START SCREEN
     GDD 12: "New Game" and "Continue", vertically stacked.
     GDD 7.1: idle here for 5 minutes to surface the scythe unlock prompt. */
  function StartScene(game) {
    this.game = game;
    this.t = 0;
    this.showInstallHelp = false;
    this.installResult = null;
    Secret.attach(this, game);
    this.stars = [];
    for (var i = 0; i < 60; i++) {
      this.stars.push({ x: Math.random(), y: Math.random() * 0.6, r: Math.random() * 1.6 + 0.4, p: Math.random() * 6 });
    }
    Audio.music('calm');
  }

  StartScene.prototype.update = function (dt) {
    this.t += dt;
    Secret.update(this, dt, this.showInstallHelp);
  };

  /* kept so anything already holding a StartScene can still poke a direction */
  StartScene.prototype.pressDir = function (dir) { Secret.press(this, dir); };

  StartScene.prototype.render = function (ctx, cw, ch) {
    var s = UI.setScale(cw, ch), t = this.t, i;

    /* night sky over a skyline - the life being taken away */
    var g = ctx.createLinearGradient(0, 0, 0, ch);
    g.addColorStop(0, '#1a1030');
    g.addColorStop(0.55, '#3a1f47');
    g.addColorStop(1, '#6b3352');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cw, ch);

    for (i = 0; i < this.stars.length; i++) {
      var st = this.stars[i];
      ctx.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(t * 0.8 + st.p));
      ctx.fillStyle = '#fff';
      Art.ellipse(ctx, st.x * cw, st.y * ch, st.r, st.r); ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* skyline */
    ctx.fillStyle = '#150d22';
    var bw = cw / 11;
    for (i = 0; i < 12; i++) {
      var bh = ch * (0.16 + ((i * 37) % 11) / 11 * 0.24);
      ctx.fillRect(i * bw - 4, ch - bh, bw + 2, bh);
      ctx.fillStyle = 'rgba(255,220,140,0.5)';
      for (var wI = 0; wI < 4; wI++) {
        if ((i * 7 + wI * 3) % 5 < 2) ctx.fillRect(i * bw + 8 + wI * 9, ch - bh + 14 + wI * 16, 5, 7);
      }
      ctx.fillStyle = '#150d22';
    }

    /* ---- the hero, standing on the skyline, left of the menu ----
       The same 18x28 sprite the game plays, blown up at an integer scale so
       the pixels stay square. Px anchors him at his feet, so he is positioned
       by where he stands rather than by a corner. Sized off the SHORT edge,
       the way UI.setScale sizes everything else: off the height he came out
       more than twice as tall in portrait as in landscape, because the height
       is the dimension that changes when the phone turns. The short edge
       barely moves, so he is the same figure whichever way it is held. */
    var hero = V.Spr.player('down', 0, this.game.playerTint(), this.game.playerOutfit());
    var hScale = Math.max(3, Math.round((Math.min(cw, ch) * 0.36) / hero.h));
    var heroW = hero.w * hScale, heroH = hero.h * hScale;
    var heroY = ch - 26 * s;
    var heroX = Math.round(Math.max(heroW * 0.6 + 8 * s, cw * 0.24));
    /* a wash of light behind him: his hair, shirt and denim are all dark and
       the skyline behind them is darker still, so without it he sinks into it */
    var halo = ctx.createRadialGradient(heroX, heroY - heroH * 0.5, 0,
      heroX, heroY - heroH * 0.5, heroH * 0.8);
    halo.addColorStop(0, 'rgba(255,214,170,0.20)');
    halo.addColorStop(1, 'rgba(255,214,170,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(heroX - heroH, heroY - heroH * 1.35, heroH * 2, heroH * 1.7);
    V.Px.shadow(ctx, heroX, heroY, heroW * 0.42, 0.38);
    V.Px.draw(ctx, hero, heroX, heroY, { scale: hScale });

    var uiX = cw / 2;

    /* the menu's box, measured here because Garatu has to be placed around it */
    var bwid = Math.min(230 * s, cw * 0.62);
    var bx = uiX - bwid / 2;
    var by = ch * 0.235;
    var bh = 46 * s;
    /* the install row only exists where installing leads somewhere, and Garatu
       is placed against the menu's real bottom edge, so it has to be measured
       with the row rather than without it */
    var installMode = V.Install.mode();
    var menuBottom = by + (bh + 14 * s) * 2 + 34 * s + (installMode ? 44 * s : 0);

    /* Garatu, watching from the far side, at an integer scale so the pixels
       stay square on the full-resolution canvas. On a wide screen he clears
       the menu by sitting right of it; on a narrow one his wingspan reaches
       into the menu's column, so there he drops below it instead. */
    var gar = V.Spr.garatu(Math.floor(t * 2) % 2);
    var gScale = Math.max(2, Math.round(Math.min(cw, ch) / 190));
    var garX = cw - Math.max(46, cw * 0.12);
    var garY = ch * 0.6;
    if (garX - gar.w * gScale / 2 < bx + bwid) {
      garY = Math.max(garY, menuBottom + gar.h * gScale + 16 * s);
    }
    /* 0.34 was tuned when he was a dark red demon against a lit sky - at that
       alpha a dark shape still reads. Bone feathers at 0.34 over this purple
       just go grey and muddy, so he has to come up to stay a creature rather
       than a smudge. Still short of solid: he is watching, not present. */
    ctx.globalAlpha = 0.66 + 0.07 * Math.sin(t * 0.9);
    V.Px.draw(ctx, gar, garX, garY + Math.round(Math.sin(t * 0.7) * 10), { scale: gScale });
    ctx.globalAlpha = 1;

    /* title - sized to fit the width rather than a fixed 48, which ran off
       the edge of a 390pt phone */
    var titleSize = Math.min(46, cw / 7.6);
    UI.text(ctx, 'VELTHIROS', uiX, ch * 0.11, {
      size: titleSize / s, align: 'center', weight: '800', colour: '#ffe9c9', shadowAlpha: 0.7
    });
    UI.text(ctx, 'they are watching', uiX, ch * 0.11 + titleSize * 0.72, {
      size: 13, align: 'center', colour: 'rgba(255,220,190,0.7)'
    });

    /* stacked buttons, tucked under the title - he stands far enough below
       them now that they no longer have to be pushed down to meet him */
    if (UI.button(ctx, 'newgame', bx, by, bwid, bh, 'New Game')) this.game.newGame();
    var canContinue = Save.hasContinue(this.game.save);
    var resumeAt = !this.game.save.tutorialDone ? 'the opening'
      : 'Trial ' + this.game.save.trial;
    if (UI.button(ctx, 'continue', bx, by + bh + 14 * s, bwid, bh, 'Continue',
      { disabled: !canContinue,
        sub: canContinue ? resumeAt : (this.game.save.beatenGame ? 'run finished' : 'no run yet') })) {
      this.game.continueRun();
    }

    var oy = by + (bh + 14 * s) * 2;
    if (UI.button(ctx, 'sound', bx, oy, bwid * 0.48 - 5 * s, 34 * s, Audio.enabled ? 'Sound on' : 'Sound off')) {
      Audio.setEnabled(!Audio.enabled);
    }
    if (UI.button(ctx, 'howto', bx + bwid * 0.52 + 5 * s, oy, bwid * 0.48 - 5 * s, 34 * s, 'How to play')) {
      this.game.setScene(new S.HelpScene(this.game));
    }

    /* Install. Absent unless it would actually do something - see V.Install. */
    if (installMode) {
      var iw = bwid * 0.72, ix = uiX - iw / 2, iy = oy + 44 * s;
      var label = installMode === 'manual' ? 'Add to Home Screen' : 'Install app';
      if (UI.button(ctx, 'install', ix, iy, iw, 32 * s, label,
        { size: 14, fill: 'rgba(38,48,66,0.9)', stroke: 'rgba(126,214,233,0.45)' })) {
        if (installMode === 'manual') {
          this.showInstallHelp = true;
          Audio.play('confirm');
        } else {
          var self = this;
          V.Install.run().then(function (outcome) {
            self.installResult = outcome === 'accepted' ? 'Installing...' : null;
            Audio.play(outcome === 'accepted' ? 'unlock' : 'deny');
          });
        }
      }
    }
    if (this.installResult) {
      UI.text(ctx, this.installResult, uiX, oy + 62 * s,
        { size: 12, align: 'center', colour: 'rgba(126,214,233,0.85)' });
    }

    /* footer state */
    var sv = this.game.save;
    UI.text(ctx, 'deaths ' + sv.deaths + '/' + D.DEATH_LIMIT + '   ' + D.CURRENCY.symbol + ' ' + U.fmtNum(sv.currency) +
      (sv.scytheUnlocked ? '   scythe: unlocked' : ''),
      cw - 14 * s, ch - 18 * s, { size: 11, align: 'right', colour: 'rgba(255,255,255,0.45)' });

    if (this.secret.flash > 0) {
      UI.text(ctx, 'THE SCYTHE IS YOURS', uiX, ch * 0.35,
        { size: 22, align: 'center', weight: '800', colour: '#c9f0ea' });
    }

    if (this.showInstallHelp) return this.drawInstallHelp(ctx, cw, ch, s);

    if (this.secret.shown) return Secret.drawPanel(this, ctx, cw, ch, s);

    if (!this.game.save.scytheUnlocked) {
      /* Below the menu, not over it. At ch*0.33 the mark sat squarely on top
         of Continue - menuBottom is already measured here for Garatu, so use
         the same edge rather than another guessed fraction. */
      if (!Secret.drawMark(this, ctx, uiX, menuBottom + 10 * s, s, t)) {
        /* the faintest nudge - the mechanic is meant to be discovered */
        var left = Math.max(0, this.game.idleUnlockSeconds - this.secret.idle);
        if (left < 30) {
          UI.text(ctx, '. . .', uiX, ch * 0.35, { size: 20, align: 'center',
            colour: 'rgba(255,255,255,' + (0.15 + 0.2 * Math.sin(t * 4)) + ')' });
        }
      }
    }
  };

  /* iOS has no install API at all, so the only honest thing to offer is the
     three taps that do it by hand. */
  StartScene.prototype.drawInstallHelp = function (ctx, cw, ch, s) {
    Input.clearZones();               /* the menu is behind this panel */
    UI.dim(ctx, cw, ch, 0.8);
    var w = Math.min(340 * s, cw - 30), x = cw / 2 - w / 2;
    var h = Math.min(300 * s, ch - 80 * s), y = ch / 2 - h / 2;
    UI.panel(ctx, x, y, w, h, { fill: 'rgba(18,14,26,0.96)', stroke: 'rgba(126,214,233,0.5)' });

    UI.text(ctx, 'Add to Home Screen', cw / 2, y + 30 * s,
      { size: 18, align: 'center', weight: '800', colour: '#c9f0ea' });
    UI.text(ctx, 'It runs full screen and works offline.', cw / 2, y + 54 * s,
      { size: 12, align: 'center', colour: 'rgba(255,255,255,0.6)' });

    var steps = [
      '1.  Tap the Share button',
      '2.  Scroll to "Add to Home Screen"',
      '3.  Tap Add'
    ];
    for (var i = 0; i < steps.length; i++) {
      UI.text(ctx, steps[i], x + 26 * s, y + 92 * s + i * 30 * s,
        { size: 14, colour: 'rgba(255,255,255,0.88)' });
    }
    UI.text(ctx, 'Safari only - other iOS browsers cannot add it.', cw / 2, y + h - 62 * s,
      { size: 11, align: 'center', colour: 'rgba(255,255,255,0.4)' });

    if (UI.button(ctx, 'installclose', cw / 2 - 70 * s, y + h - 46 * s, 140 * s, 34 * s, 'Got it')) {
      this.showInstallHelp = false;
    }
  };

  /* =================================================================== HELP */
  function HelpScene(game) { this.game = game; this.t = 0; }
  HelpScene.prototype.update = function (dt) { this.t += dt; };
  HelpScene.prototype.render = function (ctx, cw, ch) {
    var s = UI.setScale(cw, ch);
    ctx.fillStyle = '#1a1030';
    ctx.fillRect(0, 0, cw, ch);
    var w = Math.min(440 * s, cw - 28), x = cw / 2 - w / 2, y = 22 * s;
    UI.panel(ctx, x, y, w, ch - 44 * s);
    UI.text(ctx, 'How to play', cw / 2, y + 26 * s, { size: 22, align: 'center', weight: '800' });

    var lines = [
      ['Move', 'Drag anywhere on the left half of the screen.'],
      ['ATK / special', 'Bottom-right. Special costs more stamina and has a cooldown.'],
      ['DODGE', 'Brief invulnerability. Costs stamina.'],
      ['Hide', 'Stand still in a bush and enemies lose you.'],
      ['Rank', 'Top 25% pays. 26-40% is a wash. Below 40% you redo the trial with a debuff.'],
      ['Death', 'Back to the start of the same trial. ' + D.DEATH_LIMIT + ' deaths wipes the run.'],
      ['Every 5th', 'A Reaper comes instead of a trial.'],
      ['Keyboard', 'WASD move, J attack, K special, L dodge, Q item, Esc pause.']
    ];
    var ly = y + 56 * s;
    for (var i = 0; i < lines.length; i++) {
      UI.text(ctx, lines[i][0], x + 18 * s, ly, { size: 13, weight: '800', colour: '#ffe45c' });
      var wrapped = UI.wrap(ctx, lines[i][1], w - 36 * s, 12);
      for (var j = 0; j < wrapped.length; j++) {
        UI.text(ctx, wrapped[j], x + 18 * s, ly + 16 * s + j * 14 * s, { size: 12, colour: 'rgba(255,255,255,0.8)' });
      }
      ly += 22 * s + wrapped.length * 14 * s;
    }
    if (UI.button(ctx, 'back', cw / 2 - 70 * s, ch - 58 * s, 140 * s, 36 * s, 'Back')) {
      this.game.setScene(new S.StartScene(this.game));
    }
  };

  /* =============================================================== BEDROOM
     GDD 2: mood-setting intro (non-interactive), then the same room becomes
     the hub with both shops (GDD 4). */
  function RoomScene(game, mode) {
    this.game = game;
    this.mode = mode;                 /* 'intro' | 'hub' */
    this.t = 0;
    /* The bedroom is a mood beat, not a level. It used to run 11s, which is a
       long time to look at a room you cannot leave; the square that follows it
       is where the player actually gets to walk around. */
    this.introTimer = mode === 'intro' ? 8 : 0;
    this.px = 0; this.py = 60;
    this.pfacing = -Math.PI / 2;
    this.animPhase = 0;
    this.moving = false;
    this.W = 620; this.H = 320;
    this.prompt = null;
    this.fade = mode === 'intro' ? 1 : 0;
    this.dialog = mode === 'intro' ? 'Another night in the tower.' : null;
    this.dialogTime = mode === 'intro' ? 4 : 0;
    /* The same secret as the title screen, from the same implementation. The
       room is where anyone actually stands around between trials, so it is the
       obvious second place for it - and two copies of a secret is two chances
       for them to disagree about whether it has been found. */
    Secret.attach(this, game);
    Audio.music(mode === 'intro' ? 'calm' : 'hub');
  }

  RoomScene.prototype.pressDir = function (dir) { Secret.press(this, dir); };

  RoomScene.prototype.zones = function () {
    if (this.mode !== 'hub') return [];
    return [
      { id: 'reality', x: -220, y: 0, r: 66, label: 'Reality Shop' },
      { id: 'trial', x: 220, y: 0, r: 66, label: 'Trial Shop' },
      { id: 'gate', x: 0, y: -112, r: 60, label: 'Enter Trial ' + this.game.save.trial }
    ];
  };

  RoomScene.prototype.update = function (dt) {
    this.t += dt;
    this.fade = Math.max(0, this.fade - dt * 0.8);
    /* Blocked while the panel is up: the arrows belong to the combo then, and
       the room would otherwise walk the player around behind it. */
    Secret.update(this, dt, false);
    if (this.secret.shown) return;
    if (this.dialogTime > 0) {
      this.dialogTime -= dt;
      if (this.dialogTime <= 0) this.dialog = null;
    }

    var mv = Input.move;
    var speed = 105;
    if (mv.mag > 0.08) {
      this.px += mv.x * speed * mv.mag * dt;
      this.py += mv.y * speed * mv.mag * dt;
      this.pfacing = Math.atan2(mv.y, mv.x);
      this.moving = true;
      this.animPhase += dt * 12;
    } else { this.moving = false; this.animPhase += dt * 2; }
    this.px = U.clamp(this.px, -this.W / 2 + 26, this.W / 2 - 26);
    this.py = U.clamp(this.py, -this.H / 2 + 40, this.H / 2 - 26);

    /* nearest interactable */
    this.prompt = null;
    var zs = this.zones();
    for (var i = 0; i < zs.length; i++) {
      if (U.dist2(this.px, this.py, zs[i].x, zs[i].y) < zs[i].r * zs[i].r) { this.prompt = zs[i]; break; }
    }
    if (this.prompt && (Input.wasPressed('interact') || Input.wasPressed('actionbtn'))) {
      this.trigger(this.prompt.id);
    }

    if (this.mode === 'intro') {
      this.introTimer -= dt;
      if (this.introTimer < 4.5 && !this.saidTwo) {
        this.saidTwo = true;
        this.dialog = 'Nothing in here is worth staying for. Go out.';
        this.dialogTime = 4;
      }
      if (this.introTimer <= 0) this.game.enterSquare();
    }
  };

  RoomScene.prototype.trigger = function (id) {
    Audio.play('confirm');
    if (id === 'reality') this.game.setScene(new S.ShopScene(this.game, 'reality'));
    else if (id === 'trial') this.game.setScene(new S.ShopScene(this.game, 'trial'));
    else if (id === 'gate') this.game.enterTrial();
  };

  RoomScene.prototype.render = function (ctx, cw, ch) {
    var target = this.game.worldTarget();
    this.renderWorld(target.ctx, target.w, target.h);
    this.game.flushWorld(target);
    this.renderUI(ctx, cw, ch);
  };

  /* the room itself - drawn into the pixel buffer when pixel mode is on */
  RoomScene.prototype.renderWorld = function (ctx, cw, ch) {
    var s = UI.setScale(cw, ch), t = this.t;
    this._labels = [];
    /* the room is 460 wide and spans -219..+99 vertically once projected */
    var zoom = U.clamp(Math.min(cw / (this.W + 60), (ch - 26) / 372), 0.4, 1.5);

    var bg = ctx.createRadialGradient(cw / 2, ch / 2, 40, cw / 2, ch / 2, Math.max(cw, ch) * 0.75);
    bg.addColorStop(0, '#241a33');
    bg.addColorStop(1, '#0d0916');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cw, ch);

    this._originX = cw / 2;
    this._originY = ch / 2 + 60 * zoom;
    this._zoom = zoom;

    ctx.save();
    ctx.translate(this._originX, this._originY);
    ctx.scale(zoom, zoom);
    var SQ = Art.SQUASH;
    function P(x, y) { return { x: x, y: y * SQ }; }

    var W = this.W, H = this.H;

    /* floor */
    ctx.fillStyle = '#8a6f52';
    ctx.fillRect(-W / 2, -H / 2 * SQ, W, H * SQ);
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    for (var fx = -W / 2; fx < W / 2; fx += 46) ctx.fillRect(fx, -H / 2 * SQ, 2, H * SQ);

    /* back wall */
    ctx.fillStyle = '#5e4f74';
    ctx.fillRect(-W / 2, -H / 2 * SQ - 120, W, 120);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(-W / 2, -H / 2 * SQ - 120, W, 40);

    /* window with the city outside */
    var wx = -158, wy = -H / 2 * SQ - 104;
    ctx.fillStyle = '#1c1430';
    Art.roundRect(ctx, wx, wy, 120, 78, 6); ctx.fill();
    ctx.fillStyle = '#2f2450';
    for (var b = 0; b < 4; b++) ctx.fillRect(wx + 8 + b * 28, wy + 30 + (b % 2) * 12, 20, 48);
    ctx.fillStyle = 'rgba(255,220,140,0.75)';
    for (var lw = 0; lw < 10; lw++) {
      ctx.fillRect(wx + 12 + (lw % 4) * 28, wy + 38 + Math.floor(lw / 4) * 14, 4, 5);
    }
    ctx.strokeStyle = '#3b2f4d'; ctx.lineWidth = 5;
    Art.roundRect(ctx, wx, wy, 120, 78, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx + 60, wy); ctx.lineTo(wx + 60, wy + 78); ctx.stroke();

    /* bed */
    ctx.fillStyle = '#7a4b3a';
    Art.roundRect(ctx, W / 2 - 150, -H / 2 * SQ + 6, 130, 74, 8); ctx.fill(); Art.outline(ctx, 3);
    ctx.fillStyle = '#e0e6f0';
    Art.roundRect(ctx, W / 2 - 144, -H / 2 * SQ + 12, 118, 40, 6); ctx.fill();
    ctx.fillStyle = '#c9d4e6';
    Art.roundRect(ctx, W / 2 - 140, -H / 2 * SQ + 14, 44, 24, 5); ctx.fill();

    /* desk */
    ctx.fillStyle = '#6b4a2c';
    Art.roundRect(ctx, -W / 2 + 24, -H / 2 * SQ + 10, 110, 52, 6); ctx.fill(); Art.outline(ctx, 3);
    ctx.fillStyle = '#9aa0a8';
    Art.roundRect(ctx, -W / 2 + 48, -H / 2 * SQ + 18, 44, 28, 3); ctx.fill(); Art.outline(ctx, 2);

    /* purchased decor */
    var sv = this.game.save;
    if (sv.decor.rug) {
      ctx.fillStyle = '#a4405a';
      ctx.beginPath(); ctx.ellipse(0, 30 * SQ, 100, 54 * SQ, 0, 0, U.TAU); ctx.fill();
      ctx.strokeStyle = '#d9738c'; ctx.lineWidth = 6; ctx.stroke();
    }
    if (sv.decor.plant) Art.drawProp(ctx, 'bush', -W / 2 + 40, H / 2 * SQ - 30, 1.0, 4, t);
    if (sv.decor.lamp) {
      ctx.fillStyle = '#3b2f4d';
      Art.roundRect(ctx, W / 2 - 60, -30, 8, 60, 3); ctx.fill();
      ctx.fillStyle = '#ffe1a0';
      Art.ellipse(ctx, W / 2 - 56, -40, 24, 18); ctx.fill();
      var lg = ctx.createRadialGradient(W / 2 - 56, -30, 6, W / 2 - 56, -30, 130);
      lg.addColorStop(0, 'rgba(255,225,160,0.30)');
      lg.addColorStop(1, 'rgba(255,225,160,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(W / 2 - 190, -160, 270, 300);
    }
    if (sv.decor.shelf) {
      ctx.fillStyle = '#6b4a2c';
      Art.roundRect(ctx, -W / 2 + 20, -H / 2 * SQ - 66, 90, 10, 3); ctx.fill();
      for (var tr = 0; tr < 3; tr++) {
        ctx.fillStyle = ['#e8c14a', '#c9f0ea', '#ff7a3c'][tr];
        Art.ellipse(ctx, -W / 2 + 36 + tr * 28, -H / 2 * SQ - 74, 7, 9); ctx.fill(); Art.outline(ctx, 2);
      }
    }

    /* hub fixtures */
    if (this.mode === 'hub') {
        this.drawCounter(ctx, -220, 0, '#4a7fd8', 'REALITY');
      this.drawCounter(ctx, 220, 0, '#d84a4a', 'TRIAL');
      this.drawGate(ctx, 0, -112, t);
    }

    /* the player is a sprite, so remember where the room transform puts them
       and draw it after the restore at exactly one buffer pixel per sprite pixel */
    var pp = P(this.px, this.py);
    Art.shadow(ctx, pp.x, pp.y, 9);
    this._playerAt = { x: this._originX + pp.x * zoom, y: this._originY + pp.y * zoom };

    ctx.restore();

    var view = V.E.viewOf(this.pfacing);
    var frame = V.E.walkFrame(this.animPhase, this.moving);
    V.Px.draw(ctx, V.Spr.player(view.dir, frame, this.game.playerTint(), this.game.playerOutfit()),
      this._playerAt.x, this._playerAt.y, { flip: view.flip });
  };

  /* HUD and prompts - always full resolution so text stays crisp */
  RoomScene.prototype.renderUI = function (ctx, cw, ch) {
    var s = UI.setScale(cw, ch), t = this.t;
    var sv = this.game.save;

    /* labels from the world pass, drawn here so they stay crisp */
    var ps = this.game.pixScale || 1;
    for (var li = 0; li < (this._labels || []).length; li++) {
      var lb = this._labels[li];
      UI.text(ctx, lb.text,
        (this._originX + lb.x * this._zoom) * ps,
        (this._originY + lb.y * this._zoom) * ps,
        { size: lb.size, align: 'center', weight: '800', colour: lb.colour });
    }

    /* ---- overlay UI ---- */
    Input.stickEnabled = true;
    V.HUD.drawStick(ctx, cw, ch, s);

    if (this.mode === 'hub') {
      UI.text(ctx, D.CURRENCY.symbol + ' ' + U.fmtNum(sv.currency), 16 * s, 22 * s, { size: 18, weight: '800', colour: '#ffe45c' });
      UI.text(ctx, 'Trial ' + sv.trial + ' / ' + D.TOTAL_TRIALS + '   deaths ' + sv.deaths + '/' + D.DEATH_LIMIT,
        16 * s, 44 * s, { size: 12, colour: 'rgba(255,255,255,0.7)' });
      if (sv.gem) {
        var gem = D.GEMS[sv.gem.id];
        Art.drawGem(ctx, cw - 32 * s, 30 * s, 14 * s, gem, t);
        UI.text(ctx, gem.name + ' ' + U.roman(Save.gemLevel(sv)), cw - 52 * s, 30 * s,
          { size: 12, align: 'right', colour: gem.glow });
      }
      var income = Save.passiveIncome(sv);
      if (income > 0) {
        UI.text(ctx, '+' + income + ' / trial', 16 * s, 62 * s, { size: 11, colour: '#7fe08a' });
      }

      /* weapon selector - the scythe shows up here once discovered */
      var ownedW = [];
      for (var wi = 0; wi < D.WEAPON_ORDER.length; wi++) {
        if (sv.weapons[D.WEAPON_ORDER[wi]]) ownedW.push(D.WEAPON_ORDER[wi]);
      }
      var curW = D.WEAPONS[sv.weapon];
      var wBtnW = Math.min(150 * s, cw * 0.42);
      if (UI.button(ctx, 'weapon', cw - wBtnW - 14 * s, ch - 62 * s, wBtnW, 40 * s,
        curW.name + (ownedW.length > 1 ? '  >' : ''), {
          size: 13, sub: 'Lv ' + Save.weaponLevel(sv) + (ownedW.length > 1 ? '  tap to swap' : ''),
          disabled: ownedW.length < 2
        })) this.game.cycleWeapon();

      if (this.prompt) {
        var bw = Math.min(240 * s, cw * 0.6);
        if (UI.button(ctx, 'actionbtn', cw / 2 - bw / 2, ch - 122 * s, bw, 44 * s, this.prompt.label)) {
          this.trigger(this.prompt.id);
        }
      } else {
        UI.text(ctx, 'walk to a counter or the gate', cw / 2, ch - 22 * s,
          { size: 12, align: 'center', colour: 'rgba(255,255,255,0.45)' });
      }
    }

    if (this.dialog) {
      var dw = Math.min(420 * s, cw - 40);
      UI.panel(ctx, cw / 2 - dw / 2, ch - 74 * s, dw, 44 * s, { fill: 'rgba(14,10,22,0.85)' });
      UI.text(ctx, this.dialog, cw / 2, ch - 52 * s, { size: 14, align: 'center', colour: 'rgba(255,240,220,0.92)' });
    }

    if (this.fade > 0) {
      ctx.fillStyle = 'rgba(0,0,0,' + this.fade + ')';
      ctx.fillRect(0, 0, cw, ch);
    }

    if (this.secret.shown) {
      Input.clearZones();               /* the room's buttons are behind this */
      return Secret.drawPanel(this, ctx, cw, ch, s);
    }
    if (this.secret.flash > 0) {
      UI.text(ctx, 'THE SCYTHE IS YOURS', cw / 2, ch * 0.3,
        { size: 20, align: 'center', weight: '800', colour: '#c9f0ea' });
    }
    /* Top-left in the bedroom, where nothing else is; below the weapon button
       in the hub, which owns the bottom-right corner. */
    Secret.drawMark(this, ctx,
      this.mode === 'hub' ? cw - 34 * s : 34 * s,
      this.mode === 'hub' ? ch - 112 * s : 74 * s, s, t);
  };

  RoomScene.prototype.drawCounter = function (ctx, x, y, colour, label) {
    var yy = y * Art.SQUASH;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    Art.ellipse(ctx, x, yy + 20, 52, 16); ctx.fill();
    ctx.fillStyle = colour;
    Art.roundRect(ctx, x - 48, yy - 30, 96, 50, 8); ctx.fill(); Art.outline(ctx, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    Art.roundRect(ctx, x - 42, yy - 24, 84, 14, 5); ctx.fill();
    this._labels.push({ x: x, y: yy + 34, text: label, size: 11, colour: 'rgba(255,255,255,0.85)' });
  };

  RoomScene.prototype.drawGate = function (ctx, x, y, t) {
    var yy = y * Art.SQUASH;
    var pulse = 0.6 + 0.25 * Math.sin(t * 2.2);
    var g = ctx.createRadialGradient(x, yy - 20, 4, x, yy - 20, 60);
    g.addColorStop(0, 'rgba(180,120,255,' + pulse + ')');
    g.addColorStop(1, 'rgba(80,40,140,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 70, yy - 92, 140, 150);
    ctx.strokeStyle = '#b58cff'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(x, yy - 20, 34, 46, 0, 0, U.TAU);
    ctx.stroke();
    this._labels.push({ x: x, y: yy - 82, text: 'THE GATE', size: 12, colour: '#e0ccff' });
  };

  /* ================================================================== SQUARE
     The crowded plaza the player is taken from. It is deliberately the only
     place in the game with people in it: everything after this is empty, and
     the tutorial replays this exact square with the life drained out.

     No combat, no entity classes - the crowd is plain data on a random walk,
     drawn with the existing player sprite at assorted tints. */
  var CROWD_TINTS = [
    '#3d6fa8', '#a8563d', '#4f8a5e', '#8a4f7e', '#c2a061', '#5f6670',
    '#b06a40', '#446b8a', '#7a5ea8', '#8c8f3f', '#a83d4f', '#3f8a8a'
  ];

  function SquareScene(game) {
    this.game = game;
    this.t = 0;
    this.W = 900; this.H = 460;
    this.px = 0; this.py = 170;
    this.pfacing = -Math.PI / 2;
    this.animPhase = 0;
    this.moving = false;
    this.fade = 1;
    this.phase = 'walk';          /* walk -> arrival -> fall */
    this.phaseTime = 0;
    this.shake = 0;
    this.dialog = 'Friday night. The square is packed.';
    this.dialogTime = 4;
    this.meet = { x: 0, y: -60, r: 78 };

    /* the crowd: a fixed seed so the square looks the same every time */
    var r = U.rng(U.hash('velthiros:square'));
    this.crowd = [];
    for (var i = 0; i < 26; i++) {
      var a = r() * U.TAU, d = Math.sqrt(r()) * 0.5;
      this.crowd.push({
        x: Math.cos(a) * d * this.W, y: Math.sin(a) * d * this.H,
        angle: r() * U.TAU, speed: 22 + r() * 26,
        pauseFor: r() * 2.5, walkFor: 0,
        tint: CROWD_TINTS[i % CROWD_TINTS.length],
        phase: r() * 6, scatter: 0
      });
    }
    Audio.music('calm');
  }

  SquareScene.prototype.update = function (dt) {
    this.t += dt;
    this.phaseTime += dt;
    this.fade = Math.max(0, this.fade - dt * 0.8);
    if (this.dialogTime > 0) {
      this.dialogTime -= dt;
      if (this.dialogTime <= 0) this.dialog = null;
    }
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 1.4);

    if (this.phase === 'walk') {
      var mv = Input.move;
      var speed = 150;
      if (mv.mag > 0.08) {
        this.px += mv.x * speed * mv.mag * dt;
        this.py += mv.y * speed * mv.mag * dt;
        this.pfacing = Math.atan2(mv.y, mv.x);
        this.moving = true;
        this.animPhase += dt * 12;
      } else { this.moving = false; this.animPhase += dt * 2; }
      this.px = U.clamp(this.px, -this.W / 2 + 30, this.W / 2 - 30);
      this.py = U.clamp(this.py, -this.H / 2 + 30, this.H / 2 - 30);

      if (this.t > 3 && !this.saidTwo) {
        this.saidTwo = true;
        this.dialog = 'Something under the paving is humming.';
        this.dialogTime = 4;
      }
      /* reaching the middle triggers it; so does standing around long enough,
         so the opening can never stall on a player who will not move */
      var atMeet = U.dist2(this.px, this.py, this.meet.x, this.meet.y) < this.meet.r * this.meet.r;
      if ((atMeet && this.t > 2) || this.t > 22) this.beginArrival();
    } else {
      this.moving = false;
      this.animPhase += dt * 2;
      /* the crowd runs for the edges */
      for (var i = 0; i < this.crowd.length; i++) {
        var n = this.crowd[i];
        n.scatter = Math.min(1, n.scatter + dt * 0.9);
        var away = Math.atan2(n.y - this.meet.y, n.x - this.meet.x);
        n.angle = away;
        n.x += Math.cos(away) * 210 * n.scatter * dt;
        n.y += Math.sin(away) * 210 * n.scatter * dt;
        n.phase += dt * 16;
      }
      if (this.phaseTime > 4.2) this.game.startAbduction();
    }

    if (this.phase === 'walk') this.updateCrowd(dt);
    if (Input.wasPressed('skip')) this.game.startAbduction();
  };

  SquareScene.prototype.updateCrowd = function (dt) {
    for (var i = 0; i < this.crowd.length; i++) {
      var n = this.crowd[i];
      if (n.pauseFor > 0) {
        n.pauseFor -= dt;
        if (n.pauseFor <= 0) { n.walkFor = 1 + Math.random() * 2.5; n.angle = Math.random() * U.TAU; }
        continue;
      }
      n.walkFor -= dt;
      if (n.walkFor <= 0) { n.pauseFor = 0.6 + Math.random() * 2.2; continue; }
      n.x += Math.cos(n.angle) * n.speed * dt;
      n.y += Math.sin(n.angle) * n.speed * dt;
      n.phase += dt * 10;
      /* turn back at the edges rather than piling up against them */
      if (Math.abs(n.x) > this.W / 2 - 30 || Math.abs(n.y) > this.H / 2 - 30) {
        n.x = U.clamp(n.x, -this.W / 2 + 30, this.W / 2 - 30);
        n.y = U.clamp(n.y, -this.H / 2 + 30, this.H / 2 - 30);
        n.angle += Math.PI;
      }
    }
  };

  SquareScene.prototype.beginArrival = function () {
    this.phase = 'arrival';
    this.phaseTime = 0;
    this.shake = 1;
    this.dialog = '"There you are."';
    this.dialogTime = 4;
    Audio.music(null);
    Audio.play('warp');
  };

  SquareScene.prototype.render = function (ctx, cw, ch) {
    var target = this.game.worldTarget();
    this.renderWorld(target.ctx, target.w, target.h);
    this.game.flushWorld(target);
    this.renderUI(ctx, cw, ch);
  };

  SquareScene.prototype.renderWorld = function (ctx, cw, ch) {
    var t = this.t, i;
    var W = this.W, H = this.H, SQ = Art.SQUASH;
    this._labels = [];
    var zoom = U.clamp(Math.min(cw / (W + 80), (ch - 40) / (H * SQ + 220)), 0.3, 1.2);

    /* night sky over the rooftops */
    var sky = ctx.createLinearGradient(0, 0, 0, ch);
    sky.addColorStop(0, '#0e1220');
    sky.addColorStop(1, '#2b3446');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, cw, ch);

    var sx = 0, sy = 0;
    if (this.shake > 0) {
      sx = Math.round((Math.random() - 0.5) * 10 * this.shake);
      sy = Math.round((Math.random() - 0.5) * 10 * this.shake);
    }
    this._originX = Math.round(cw / 2) + sx;
    this._originY = Math.round(ch / 2 + 40 * zoom) + sy;
    this._zoom = zoom;

    ctx.save();
    ctx.translate(this._originX, this._originY);
    ctx.scale(zoom, zoom);

    var top = -H / 2 * SQ;

    /* the block: towers and lit signage behind the plaza */
    var towers = [
      [-470, 250, 210, '#1b2130'], [-240, 190, 260, '#232a3c'], [-40, 150, 300, '#1b2130'],
      [120, 210, 240, '#232a3c'], [340, 170, 250, '#1b2130']
    ];
    for (i = 0; i < towers.length; i++) {
      var tw = towers[i];
      ctx.fillStyle = tw[3];
      ctx.fillRect(tw[0], top - tw[2], tw[1], tw[2] + 10);
      /* lit windows */
      var rw = U.rng(U.hash('tower' + i));
      for (var wy = top - tw[2] + 14; wy < top - 16; wy += 22) {
        for (var wx = tw[0] + 12; wx < tw[0] + tw[1] - 14; wx += 20) {
          if (!rw.chance(0.55)) continue;
          ctx.fillStyle = rw.chance(0.25) ? 'rgba(255,225,160,0.9)' : 'rgba(150,190,240,0.55)';
          ctx.fillRect(wx, wy, 9, 11);
        }
      }
    }
    /* the big sign - the one thing that says "square" rather than "street" */
    var signPulse = 0.65 + 0.35 * Math.sin(t * 2.4);
    ctx.fillStyle = 'rgba(200,60,80,' + signPulse + ')';
    ctx.fillRect(-120, top - 176, 250, 58);
    ctx.fillStyle = 'rgba(255,225,160,' + (0.5 + 0.4 * Math.sin(t * 3.1)) + ')';
    ctx.fillRect(-108, top - 164, 226, 12);
    ctx.fillRect(-108, top - 142, 150, 12);
    this._labels.push({ x: 5, y: top - 200, text: 'AURELIA SQUARE', size: 12, colour: '#ffd9a0' });

    /* pavement and kerb, so the back of the square meets the buildings
       instead of the slab ending in mid-air */
    ctx.fillStyle = '#3a3f48';
    ctx.fillRect(-W / 2 - 40, top - 26, W + 80, 30);
    ctx.fillStyle = '#606770';
    ctx.fillRect(-W / 2 - 40, top - 5, W + 80, 5);

    /* the paving */
    ctx.fillStyle = '#4f555f';
    ctx.fillRect(-W / 2, top, W, H * SQ);
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    for (var gx = -W / 2; gx < W / 2; gx += 60) ctx.fillRect(gx, top, 2, H * SQ);
    for (var gy = top; gy < top + H * SQ; gy += 38) ctx.fillRect(-W / 2, gy, W, 2);
    /* warm spill from the signage */
    var spill = ctx.createRadialGradient(0, top + 30, 20, 0, top + 30, 460);
    spill.addColorStop(0, 'rgba(255,190,120,0.20)');
    spill.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = spill;
    ctx.fillRect(-W / 2, top, W, H * SQ);

    /* the rift, once it opens */
    if (this.phase !== 'walk') {
      var open = U.clamp(this.phaseTime / 1.4, 0, 1);
      var rr = 30 + open * 190;
      var rg = ctx.createRadialGradient(this.meet.x, this.meet.y * SQ, 4, this.meet.x, this.meet.y * SQ, rr);
      rg.addColorStop(0, 'rgba(255,220,255,0.95)');
      rg.addColorStop(0.45, 'rgba(170,90,255,0.5)');
      rg.addColorStop(1, 'rgba(60,20,90,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(this.meet.x, this.meet.y * SQ, rr, rr * SQ, 0, 0, U.TAU);
      ctx.fill();
    } else {
      /* before that it is only a hum in the stone */
      var hum = 0.10 + 0.06 * Math.sin(t * 2.6);
      ctx.strokeStyle = 'rgba(180,120,255,' + hum + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(this.meet.x, this.meet.y * SQ, this.meet.r, this.meet.r * SQ, 0, 0, U.TAU);
      ctx.stroke();
    }

    /* collect everyone, then draw after the restore so sprites land on the
       pixel grid at an exact integer scale (same trick as RoomScene) */
    var bodies = [];
    var self = this;
    function place(wx2, wy2) {
      return { x: self._originX + wx2 * zoom + sx * 0, y: self._originY + wy2 * SQ * zoom };
    }
    for (i = 0; i < this.crowd.length; i++) {
      var n = this.crowd[i];
      var moving = this.phase !== 'walk' ? true : (n.pauseFor <= 0 && n.walkFor > 0);
      /* once they scatter they run off the paving, so fade them as they go
         rather than letting them jog away across the skyline */
      var out = Math.max(Math.abs(n.x) / (W / 2), Math.abs(n.y) / (H / 2));
      var fade = U.clamp(1 - (out - 1) * 3, 0, 1);
      if (fade <= 0) continue;
      ctx.globalAlpha = fade;
      Art.shadow(ctx, n.x, n.y * SQ, 8);
      ctx.globalAlpha = 1;
      bodies.push({ y: n.y, at: place(n.x, n.y), facing: n.angle, phase: n.phase,
                    moving: moving, tint: n.tint, alpha: fade });
    }
    Art.shadow(ctx, this.px, this.py * SQ, 9);
    bodies.push({
      y: this.py + 0.1, at: place(this.px, this.py), facing: this.pfacing,
      phase: this.animPhase, moving: this.moving, tint: this.game.playerTint(),
      outfit: this.game.playerOutfit(), isPlayer: true
    });

    ctx.restore();

    bodies.sort(function (a, b) { return a.y - b.y; });
    for (i = 0; i < bodies.length; i++) {
      var bd = bodies[i];
      var view = V.E.viewOf(bd.facing);
      var frame = V.E.walkFrame(bd.phase, bd.moving);
      var opts = { flip: view.flip };
      if (bd.alpha != null && bd.alpha < 1) opts.alpha = bd.alpha;
      /* the player drops through the floor once the rift is fully open */
      if (bd.isPlayer && this.phase !== 'walk' && this.phaseTime > 2.2) {
        var f = U.clamp((this.phaseTime - 2.2) / 2, 0, 1);
        opts.alpha = 1 - f;
        opts.rot = f * 0.6;
        bd.at.y += f * 34;
      }
      var sprFn = bd.isPlayer ? V.Spr.player : V.Spr.civilian;

       shape. 287 is the geometric mean of the landscape buffer this replaces,
       so the common landscape sizes come out byte-identical. */
    this.pixelTargetSpan = 287;
    var startTrial = parseInt(q.get('trial'), 10);
    this.forceTrial = (isFinite(startTrial) && startTrial > 0) ? startTrial : 0;
  }

  /* ================================================================== boot */
  Game.prototype.start = function () {
    var self = this;
    Input.init(this.canvas);
    this.resize();
    window.addEventListener('resize', function () { self.resize(); });
    window.addEventListener('orientationchange', function () { setTimeout(function () { self.resize(); }, 120); });

    /* audio needs a gesture */
    var unlock = function () {
      Audio.init();
      Audio.resume();
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);

    V.Haptics.enabled = this.save.haptics !== false;
    this.bindLifecycle();

    this.setScene(new S.StartScene(this));
    this.running = true;
    this.last = performance.now();
    requestAnimationFrame(function (t) { self.frame(t); });
  };

  /* ------------------------------------------------- device integration */

  /* A call, a notification or a tab switch must not cost you a trial: hide
     means pause, and coming back resumes exactly where you left off. */
  Game.prototype.bindLifecycle = function () {
    var self = this;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) self.suspend();
      else self.wake();
    });
    window.addEventListener('pagehide', function () { self.suspend(); });
  };

  Game.prototype.suspend = function () {
    var sc = this.scene;
    if (sc && sc.trial && sc.trial.state === 'play') sc.trial.paused = true;
    Audio.hush();
    this.releaseWakeLock();
  };

  Game.prototype.wake = function () {
    this.last = performance.now();     /* never bill the player for time away */
    Audio.unhush();
    if (this.scene && this.scene.trial) this.requestWakeLock();
  };

  /* Trials run minutes long, which is easily enough for a phone to dim
     mid-fight. Best-effort throughout: the API is missing on older Safari and
     is refused outright while the page is hidden, and neither is worth a
     message to the player. */
  Game.prototype.requestWakeLock = function () {
    var self = this;
    if (!navigator.wakeLock || this._wakeLock || document.hidden) return;
    try {
      navigator.wakeLock.request('screen').then(function (lock) {
        self._wakeLock = lock;
        lock.addEventListener('release', function () { self._wakeLock = null; });
      }, function () { /* denied */ });
    } catch (e) { /* unsupported */ }
  };

  Game.prototype.releaseWakeLock = function () {
    if (!this._wakeLock) return;
    try { this._wakeLock.release(); } catch (e) { /* already released */ }
    this._wakeLock = null;
  };

  /* ============================================================== INSTALL
     Adding the game to a home screen is the closest thing it has to being
     downloaded, so the start screen offers it - but only where the offer
     leads somewhere.

     Chrome and Edge fire beforeinstallprompt, which can be held and replayed
     from a real tap later. Safari fires nothing and has no programmatic
     install at all, so iOS gets instructions instead of a button that would
     do nothing. Everywhere else, and once it is already installed, the button
     is simply absent: an install button that cannot install is worse than no
     button. */
  var Install = {
    deferred: null,
    dismissed: false,

    /* Already running as an installed app? Then there is nothing to offer.
       iOS reports this through navigator.standalone rather than the media
       query, which it does not implement for this. */
    installed: function () {
      if (typeof navigator !== 'undefined' && navigator.standalone) return true;
      if (typeof window === 'undefined' || !window.matchMedia) return false;
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: fullscreen)').matches;
    },

    /* iOS Safari: installable by hand, never programmatically. Chrome on iOS
       is also WebKit and also cannot do it, so this deliberately tests the
       platform rather than the browser. */
    isIOS: function () {
      if (typeof navigator === 'undefined') return false;
      var ua = navigator.userAgent || '';
      return /iPad|iPhone|iPod/.test(ua) ||
             (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    },

    /* What the button should do, or nothing at all. */
    mode: function () {
      if (this.installed()) return null;
      if (this.deferred) return 'prompt';
      if (this.isIOS()) return 'manual';
      return null;
    },

    /* Returns a promise for the outcome. The held event is single-use: once
       it has been prompted it cannot be prompted again, so it is cleared
       either way. */
    run: function () {
      var e = this.deferred;
      if (!e) return Promise.resolve('unavailable');
      this.deferred = null;
      try {
        e.prompt();
        return Promise.resolve(e.userChoice).then(function (c) {
          return (c && c.outcome) || 'dismissed';
        });
      } catch (err) {
        return Promise.resolve('failed');
      }
    },

    bind: function () {
      if (typeof window === 'undefined') return;
      var self = this;
      window.addEventListener('beforeinstallprompt', function (e) {
        /* without this Chrome shows its own mini-infobar over the game */
        e.preventDefault();
        self.deferred = e;
      });
      window.addEventListener('appinstalled', function () {
        self.deferred = null;
      });
    }
  };
  Install.bind();
  V.Install = Install;

  /* env(safe-area-inset-*) is only legible from CSS, so #safe-probe wears it
     as padding and we measure that. Falls back to zeroes everywhere it is not
     supported, which is every desktop browser. */
  function readInsets() {
    var probe = document.getElementById('safe-probe');
    if (!probe || !window.getComputedStyle) return { top: 0, right: 0, bottom: 0, left: 0 };
    var cs = window.getComputedStyle(probe);
    return {
      top: parseFloat(cs.paddingTop) || 0,
      right: parseFloat(cs.paddingRight) || 0,
      bottom: parseFloat(cs.paddingBottom) || 0,
      left: parseFloat(cs.paddingLeft) || 0
    };
  }

  Game.prototype.resize = function () {
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var w = this.canvas.clientWidth || window.innerWidth;
    var h = this.canvas.clientHeight || window.innerHeight;
    this.canvas.width = Math.round(w * dpr);
    this.canvas.height = Math.round(h * dpr);
    this.dpr = dpr;
    this.cw = w; this.ch = h;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    /* the HUD lays itself out against these */
    this.inset = readInsets();
    UI.inset = this.inset;
    UI.portrait = h > w * 1.08;
  };

  /* ------------------------------------------------------- pixel pipeline */
  Game.prototype.worldTarget = function () {
    if (!this.pixelMode) { this.pixScale = 1; return { ctx: this.ctx, w: this.cw, h: this.ch, direct: true }; }

    var scale = Math.max(2, Math.round(Math.sqrt(this.cw * this.ch) / this.pixelTargetSpan));
    var bw = Math.ceil(this.cw / scale);
    var bh = Math.ceil(this.ch / scale);

    if (!this.pixCanvas) {
      this.pixCanvas = document.createElement('canvas');
      this.pixCtx = this.pixCanvas.getContext('2d');
    }
    if (this.pixCanvas.width !== bw || this.pixCanvas.height !== bh) {
      this.pixCanvas.width = bw;
      this.pixCanvas.height = bh;
    }
    this.pixScale = scale;
    var c = this.pixCtx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, bw, bh);
    c.imageSmoothingEnabled = false;
    return { ctx: c, w: bw, h: bh, direct: false };
  };

  Game.prototype.flushWorld = function (target) {
    if (!this.pixelMode || target.direct) return;
    var ctx = this.ctx;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.pixCanvas, 0, 0, this.pixCanvas.width, this.pixCanvas.height,
      0, 0, this.pixCanvas.width * this.pixScale, this.pixCanvas.height * this.pixScale);
    ctx.imageSmoothingEnabled = true;
  };

  Game.prototype.frame = function (now) {
    var self = this;
    var dt = Math.min((now - this.last) / 1000, 0.05);
    this.last = now;

    Input.update();
    if (this.scene && this.scene.update) this.scene.update(dt);

    var ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.cw, this.ch);
    if (this.scene && this.scene.render) this.scene.render(ctx, this.cw, this.ch);

    if (this.debug) {
      UI.text(ctx, Math.round(1 / Math.max(dt, 0.0001)) + ' fps', 8, this.ch - 10, { size: 10, colour: '#0f0' });
    }

    Input.endFrame();
    requestAnimationFrame(function (t) { self.frame(t); });
  };

  Game.prototype.setScene = function (scene) {
    if (scene && scene.trial) this.requestWakeLock(); else this.releaseWakeLock();
    this.scene = scene;
    Input.stickEnabled = false;
    Input.down = {};
    Input.stick.active = false;
  };

  Game.prototype.persist = function () { Save.write(this.save); };

  /* ============================================================== run flow */
  Game.prototype.newGame = function () {
    this.save = Save.newGame(this.save);
    this.pendingResult = null;      /* never carry a finished trial into a fresh run */
    this.persist();
    if (this.forceTrial) {
      this.save.trial = this.forceTrial;
      this.save.gem = { id: D.GEM_IDS[Math.floor(Math.random() * D.GEM_IDS.length)] };
      this.save.seenIntro = true;
      this.save.tutorialDone = true;   /* the dev jump skips the guided opening */
      this.persist();
      return this.setScene(new S.RoomScene(this, 'hub'));
    }
    this.setScene(new S.RoomScene(this, 'intro'));
  };

  /* The opening is bedroom -> square -> abduction -> tutorial -> hub.
     Continue re-enters wherever the player stopped, so quitting halfway
     through the tutorial resumes the tutorial rather than skipping it. */
  Game.prototype.continueRun = function () {
    if (!this.save.started) return;
    if (!this.save.seenIntro) return this.setScene(new S.RoomScene(this, 'intro'));
    if (!this.save.tutorialDone) return this.enterTutorial();
    this.setScene(new S.RoomScene(this, 'hub'));
  };

  Game.prototype.enterSquare = function () {
    this.save.tutorialStage = 'square';
    this.persist();
    this.setScene(new S.SquareScene(this));
  };

  Game.prototype.startAbduction = function () {
    this.setScene(new S.CutsceneScene(this, 'abduction'));
  };

  Game.prototype.cutsceneDone = function (kind) {
    if (kind === 'abduction') {
      this.save.seenIntro = true;
      this.persist();
      /* The gem is no longer handed over here - the tutorial grants it in
         beat 7, so the player has hands on the controls when it arrives. */
      return this.enterTutorial();
    }
    /* endgame cutscene */
    this.enterTrial();
  };

  Game.prototype.enterTutorial = function () {
    this.save.tutorialStage = 'trial';
    this.persist();
    var spec = {
      index: 0, type: 'tutorial', boss: false, tutorial: true, untimed: true,
      radius: V.Tutorial.RADIUS, env: D.TUTORIAL_ENVS[V.Tutorial.ENV],
      seed: U.hash('velthiros:tutorial:' + this.save.resets), label: 'The Square'
    };
    this.setScene(new TrialScene(this, new V.Trial(this, spec)));
  };

  Game.prototype.finishTutorial = function () {
    this.save.tutorialDone = true;
    this.save.tutorialStage = null;
    this.persist();
    this.setScene(new S.RoomScene(this, 'hub'));
  };

  Game.prototype.gemTaken = function () { this.enterTrial(); };

  /* ---------------------------------------------------------- trial specs */
  Game.prototype.makeSpec = function (index) {
    var sv = this.save;
    var seed = U.hash('velthiros:' + sv.resets + ':' + index);
    var envIndex = U.hash('env:' + seed) % D.ENVIRONMENTS.length;
    var env = D.ENVIRONMENTS[envIndex];

    if (sv.endgame) {
      var wave = sv.endgameWave;
      if (wave >= 4) {
        return {
          index: D.TOTAL_TRIALS + 4, type: 'boss', boss: true, finalBoss: true,
          /* The last fight was set on the snowfield, which was fine while the
             Aurelith was a dark insect and is not fine now that it is six
             white wings: a white boss on a white field is a boss you cannot
             read. ENVIRONMENTS[4] is the HQ - near-black ground under a
             near-black sky, which is also what the thing is drawn against. */
          env: D.ENVIRONMENTS[4], seed: seed, label: 'Aurelith'
        };
      }
      return {
        index: D.TOTAL_TRIALS + wave, type: 'defeat', boss: false,
        env: D.ENVIRONMENTS[(wave + 3) % D.ENVIRONMENTS.length], seed: seed,
        label: 'Wave ' + wave + ' / 3', endgame: true
      };
    }

    var isBoss = (index % D.BOSS_EVERY === 0);
    if (isBoss) {
      return {
        index: index, type: 'boss', boss: true, env: env, seed: seed,
        label: 'Trial ' + index + ' - Reaper'
      };
    }
    var type = D.TRIAL_ROTATION[(index - 1) % D.TRIAL_ROTATION.length];
    var typeDef = null;
    for (var i = 0; i < D.TRIAL_TYPES.length; i++) if (D.TRIAL_TYPES[i].id === type) typeDef = D.TRIAL_TYPES[i];
    return {
      index: index, type: type, boss: false, env: env, seed: seed,
      label: 'Trial ' + index + ' - ' + (typeDef ? typeDef.name : type)
    };
  };

  Game.prototype.enterTrial = function () {
    var spec = this.makeSpec(this.save.trial);
    var trial = new V.Trial(this, spec);
    this.setScene(new TrialScene(this, trial));
  };

  /* ------------------------------------------------------------- outcomes */
  Game.prototype.onTrialFinished = function (result) {
    var sv = this.save;
    var outcome = result.tier.outcome;

    /* The tutorial is not ranked, not paid and not counted. A percentile on a
       guided sequence is noise, and its deaths must not push anyone toward the
       25-death wipe before the real game has started. */
    if (result.trial.tutorial) return this.finishTutorial();

    if (result.died) {
      sv.deaths++;
      sv.stats.trialsFailed++;
    }
    sv.stats.bestRank = Math.min(sv.stats.bestRank, result.percentile);

    if (outcome === 'reward') {
      /* GDD 6.2: only the top 25% is paid */
      var base = 45 + result.trial.index * 7;
      var overPar = U.clamp(result.score / Math.max(1, result.par), 0, 2.2);
      result.payout = Math.round(base * (0.8 + overPar * 0.6)) + result.bonusCoins;
      sv.currency += result.payout;
      sv.lifetimeEarned += result.payout;
    } else {
      result.payout = result.bonusCoins;
      if (result.bonusCoins) { sv.currency += result.bonusCoins; sv.lifetimeEarned += result.bonusCoins; }
    }

    if (outcome !== 'fail') {
      /* passive income from Reality Shop businesses (GDD 9) */
      var income = Save.passiveIncome(sv);
      if (income > 0) {
        result.income = income;
        sv.currency += income;
        sv.lifetimeEarned += income;
      }
      sv.cleared++;
      sv.debuff = null;
    } else {
      /* GDD 6.2: potential debuff on the reattempt */
      if (Math.random() < 0.7) {
        var db = D.DEBUFFS[Math.floor(Math.random() * D.DEBUFFS.length)];
        sv.debuff = db.id;
        result.debuffName = db.name + ' (' + db.desc + ')';
      } else {
        sv.debuff = null;
      }
    }

    sv.lastRank = result.percentile;
    sv.stats.kills += result.kills;
    this.pendingResult = result;
    this.persist();
    this.setScene(new S.RankingScene(this, result));
  };

  Game.prototype.leaveRanking = function () {
    var sv = this.save;
    var r = this.pendingResult;

    /* GDD 9: 25 deaths in a run wipes everything */
    if (sv.deaths >= D.DEATH_LIMIT) return this.setScene(new S.ResetScene(this));

    var survived = r.tier.outcome !== 'fail';

    if (!survived) {
      /* death or below-40%: rerun the same trial */
      return this.enterTrial();
    }

    if (sv.endgame) {
      if (r.trial.finalBoss) {
        sv.beatenGame = true;
        this.persist();
        return this.setScene(new S.VictoryScene(this));
      }
      sv.endgameWave++;
      this.persist();
      return this.enterTrial();
    }

    sv.trial++;
    if (sv.trial > D.TOTAL_TRIALS) {
      /* GDD 10: escalating waves, then the final boss */
      sv.endgame = true;
      sv.endgameWave = 1;
      this.persist();
      return this.setScene(new S.CutsceneScene(this, 'endgame'));
    }
    this.persist();
    this.setScene(new S.RoomScene(this, 'hub'));
  };

  Game.prototype.confirmFullReset = function () {
    this.save = Save.fullReset(this.save);
    this.pendingResult = null;
    this.setScene(new S.StartScene(this));
  };

  /* ----------------------------------------------------------------- shop */
  Game.prototype.buy = function (item) {
    var sv = this.save;
    var count = Save.ownedCount(sv, item.id);
    if (!item.stack && count > 0) return { ok: false, message: 'Already owned.' };
    if (item.needs && !Save.ownedCount(sv, item.needs)) return { ok: false, message: 'Requires an earlier upgrade.' };
    if (sv.currency < item.price) return { ok: false, message: 'Not enough ' + D.CURRENCY.name + '.' };

    sv.currency -= item.price;
    sv.owned[item.id] = item.stack ? count + 1 : true;

    if (item.weapon) {
      sv.weapons[item.weapon] = true;
      sv.weapon = item.weapon;
    }
    if (item.tint) sv.equippedTint = item.tint;
    if (item.outfit) sv.equippedOutfit = item.outfit;
    if (item.decor) sv.decor[item.decor] = true;

    this.persist();
    return { ok: true, message: item.name + ' bought.' + (item.weapon ? ' Equipped.' : '') };
  };

  Game.prototype.spendConsumable = function (id) {
    var n = Save.ownedCount(this.save, id);
    if (n > 0) {
      this.save.owned[id] = n - 1;
      if (this.save.owned[id] <= 0) delete this.save.owned[id];
      this.persist();
    }
  };

  Game.prototype.consumableCounts = function () {
    return {
      potion: Save.ownedCount(this.save, 'c_potion'),
      tonic: Save.ownedCount(this.save, 'c_tonic'),
      smoke: Save.ownedCount(this.save, 'c_smoke')
    };
  };

  /* The shirt, not the whole outfit - see Spr.player. Black by default. */
  Game.prototype.playerTint = function () { return this.save.equippedTint || '#17141c'; };
  Game.prototype.playerOutfit = function () { return this.save.equippedOutfit || null; };

  /* GDD 7.1: the scythe unlock lasts for the rest of this run only. */
  Game.prototype.unlockScythe = function () {
    this.save.scytheUnlocked = true;
    this.save.weapons.scythe = true;
    this.save.weapon = 'scythe';
    this.persist();
  };

  Game.prototype.cycleWeapon = function () {
    var owned = [];
    for (var i = 0; i < D.WEAPON_ORDER.length; i++) {
      var id = D.WEAPON_ORDER[i];
      if (this.save.weapons[id]) owned.push(id);
    }
    if (owned.length < 2) return;
    var idx = owned.indexOf(this.save.weapon);
    this.save.weapon = owned[(idx + 1) % owned.length];
    this.persist();
  };

  /* ============================================================ TRIAL SCENE */
  function TrialScene(game, trial) {
    this.game = game;
    this.trial = trial;
  }
  TrialScene.prototype.update = function (dt) {
    if (V.Input.wasPressed('back')) this.trial.paused = !this.trial.paused;
    this.trial.update(dt);
  };
  TrialScene.prototype.render = function (ctx, cw, ch) {
    var target = this.game.worldTarget();
    this.trial.render(target.ctx, target.w, target.h);
    this.game.flushWorld(target);
    V.HUD.draw(ctx, this.trial, cw, ch);
  };

  V.Game = Game;
  V.TrialScene = TrialScene;
})(window.V = window.V || {});

/* ===== src/js/main.js ===== */
/* Velthiros - bootstrap */
(function () {
  'use strict';
  function boot() {
    var canvas = document.getElementById('game');
    var game = new window.V.Game(canvas);
    window.VELTHIROS = game;
    game.start();
    var splash = document.getElementById('boot');
    if (splash) {
      splash.classList.add('gone');
      setTimeout(function () { splash.parentNode && splash.parentNode.removeChild(splash); }, 500);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
