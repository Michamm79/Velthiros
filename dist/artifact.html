<title>Velthiros</title>
<style>
/* Velthiros - the page is a frame around a single full-bleed canvas */
:root {
  color-scheme: dark;
  --ink: #f2ecff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #0d0916;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game {
  display: block;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  touch-action: none;
  cursor: default;
}
/* shown until the first frame paints */
#boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 10px;
  text-align: center;
  background: #0d0916;
  z-index: 10;
  transition: opacity 0.4s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }
#boot h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 0.16em;
  color: #ffe9c9;
}
#boot p { margin: 0; font-size: 12px; opacity: 0.5; }
/* The canvas is full-bleed under the notch and the home indicator, so the
   HUD has to inset itself. env() is only readable from CSS, so park it on a
   zero-size probe and let the game measure its padding on every resize. */
#safe-probe {
  position: fixed;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  visibility: hidden;
  pointer-events: none;
  padding:
    env(safe-area-inset-top, 0px)
    env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px)
    env(safe-area-inset-left, 0px);
}
</style>
<canvas id="game"></canvas>
<div id="safe-probe" aria-hidden="true"></div>

<script>
/* ===== src/js/util.js ===== */
/* Velthiros - shared math, rng and helpers */
(function (V) {
  'use strict';

  var U = {};

  U.TAU = Math.PI * 2;

  U.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };
  U.lerp = function (a, b, t) { return a + (b - a) * t; };
  U.dist = function (ax, ay, bx, by) { var dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); };
  U.dist2 = function (ax, ay, bx, by) { var dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };

  /* shortest signed angular difference b - a, wrapped to [-PI, PI] */
  U.angleDelta = function (a, b) {
    var d = (b - a) % U.TAU;
    if (d > Math.PI) d -= U.TAU;
    if (d < -Math.PI) d += U.TAU;
    return d;
  };

  U.approach = function (v, target, step) {
    if (v < target) return Math.min(v + step, target);
    if (v > target) return Math.max(v - step, target);
    return target;
  };

  /* '#rrggbb' + alpha -> 'rgba(r,g,b,a)'. Short hex is not supported: every
     colour in the game comes from the locked palette, which is all 6-digit. */
  U.rgba = function (hex, alpha) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  };

  U.easeOut = function (t) { return 1 - (1 - t) * (1 - t); };
  U.easeIn = function (t) { return t * t; };
  U.easeInOut = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };

  /* Mulberry32 - small deterministic PRNG so a trial seed rebuilds the same arena */
  U.rng = function (seed) {
    var a = seed >>> 0;
    var r = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = function (lo, hi) { return lo + r() * (hi - lo); };
    r.int = function (lo, hi) { return Math.floor(lo + r() * (hi - lo + 1)); };
    r.pick = function (arr) { return arr[Math.floor(r() * arr.length)]; };
    r.chance = function (p) { return r() < p; };
    r.shuffle = function (arr) {
      var out = arr.slice();
      for (var i = out.length - 1; i > 0; i--) {
        var j = Math.floor(r() * (i + 1));
        var t = out[i]; out[i] = out[j]; out[j] = t;
      }
      return out;
    };
    return r;
  };

  /* string -> 32 bit hash, used to derive stable seeds from names */
  U.hash = function (str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };

  U.fmtTime = function (sec) {
    if (sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  U.fmtNum = function (n) {
    n = Math.floor(n);
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  };

  /* point inside a circle */
  U.inCircle = function (px, py, cx, cy, r) { return U.dist2(px, py, cx, cy) <= r * r; };

  /* push a point back inside a circular boundary, returns true if it moved */
  U.confineToCircle = function (p, cx, cy, r) {
    var dx = p.x - cx, dy = p.y - cy;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d <= r) return false;
    if (d === 0) { p.x = cx + r; return true; }
    p.x = cx + (dx / d) * r;
    p.y = cy + (dy / d) * r;
    return true;
  };

  /* is target inside a cone centred on `facing`? */
  U.inArc = function (ax, ay, facing, halfArc, range, tx, ty) {
    var dx = tx - ax, dy = ty - ay;
    var d2 = dx * dx + dy * dy;
    if (d2 > range * range) return false;
    if (d2 < 1) return true;
    var a = Math.atan2(dy, dx);
    return Math.abs(U.angleDelta(facing, a)) <= halfArc;
  };

  /* The world's Y axis is squashed on screen (3/4 view), so a target's world
     angle is not the angle the player sees. Aiming and hit tests use this
     visual angle instead, otherwise diagonal swings miss things that plainly
     look like they are in front of you. */
  U.visualAngle = function (dx, dy, squash) { return Math.atan2(dy * squash, dx); };

  U.inArcVisual = function (ax, ay, facing, halfArc, range, tx, ty, squash) {
    var dx = tx - ax, dy = ty - ay;
    var d2 = dx * dx + dy * dy;
    if (d2 > range * range) return false;
    if (d2 < 1) return true;
    var fv = Math.atan2(Math.sin(facing) * squash, Math.cos(facing));
    var av = Math.atan2(dy * squash, dx);
    return Math.abs(U.angleDelta(fv, av)) <= halfArc;
  };

  U.roman = function (n) {
    var map = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
    return map[n] || String(n);
  };

  V.U = U;
})(window.V = window.V || {});

  /* ---------------------------------------------------------------- AURELITH
     The thing at the end. Six white wings in a halo, a body so thin it is
     almost a line, and a hot core burning behind a web of ribs.

     Three passes to get the wings right, and the lesson each time was about
     shape rather than colour. Straight bars of colour read as an insect. A
     fan of one-pixel strokes sharing a root reads as a sunburst. A wide arc
     swept from a single point reads as a flower petal.

     A wing is a curved SPINE with feathers hanging off its trailing side:
     `wing` walks a leading edge outward, turning a little on every step, and
     at each step drops a run of feather perpendicular to it, tapering toward
     the tip. Bending the spine slightly harder is also what a beat is, so the
     flap comes free and pivots at the shoulder by construction - the root
     cannot move, only the accumulated turn past it. */
  function wing(g, ox, oy, a0, curve, len, depth, body, sep, edge, flap) {
    var x = ox, y = oy, a = a0;
    for (var i = 0; i < len; i++) {
      var t = i / (len - 1);
      a += curve + flap * t;            /* the bend accumulates; the root does not move */
      x += Math.cos(a);
      y += Math.sin(a);
      /* feathers hang off the trailing side, deepest at the shoulder */
      var d = Math.max(1, Math.round(depth * (1 - t * t * 0.78)));
      var pa = a - Math.PI / 2;
      var cp = Math.cos(pa), sp = Math.sin(pa);
      for (var s = 0; s <= d; s++) {
        g.set(Math.round(x + cp * s), Math.round(y + sp * s), s === d ? edge : body);
      }
      /* a separation every few steps, so it reads as feathers not as a blade */
      if (i % 5 === 3) {
        for (var s2 = Math.round(d * 0.3); s2 < d; s2++) {
          g.set(Math.round(x + cp * s2), Math.round(y + sp * s2), sep);
        }
      }
      g.set(Math.round(x), Math.round(y), edge);      /* the leading edge */
    }
  }

  /* A limb with mass. g.line is one pixel, and at this size a one-pixel line
     is a wire rather than a thin thing - the same reason Garatu's horns read
     as antennae until they were given a base. Drawn as parallel runs so a
     mostly-vertical limb keeps its width all the way down. */
  function limb(g, c, x0, y0, x1, y1, w) {
    for (var i = 0; i < w; i++) g.line(c, x0 + i, y0, x1 + i, y1);
  }

  Spr.aurelith = function (frame) {
    return cached('au:' + frame, function () {
      return Px.make(63, 68, function (g) {
        var cx = 31;
        var flap = frame ? 0.012 : 0;   /* extra bend per step along the spine */

        /* --- the halo, back to front. Canvas angles: y grows downward, so PI
               points out to the left and 4.71 points straight up. --- */
        /* lower pair: long, drooping, the tips almost at the floor */
        wing(g, cx - 4, 33, 2.55, -0.022, 25, 7, ')', 'i', '(', flap * 0.8);
        /* middle pair: the widest sweep, out past everything else. Started
           life flat and thin, which cut the sprite in half like a plank -
           it needs both the depth and the bend to read as a wing. */
        wing(g, cx - 5, 27, 3.58, -0.034, 26, 11, '(', ')', 'Q', flap);
        /* upper pair: rises outside the head, then curls back over it */
        wing(g, cx - 6, 26, 4.16, 0.030, 26, 7, '(', ')', 'Q', flap * 1.4);
        /* the small inner pair, folded down the front of the ribs. Behind the
           body, not over it: the torso is the one thing that must stay read. */
        wing(g, cx - 3, 24, 1.82, 0.016, 15, 4, '(', ')', 'Q', flap * 0.5);

        /* --- speckled growths ---
               Seeded, so the boss bakes identically every run. The dark
               clusters ride the upper wings; the coral spills off the
               shoulders and down the inside of the middle pair. */
        g.speckle('N', cx - 19, 9, 9, 8, 13, 7717);
        g.speckle('^', cx - 19, 28, 14, 7, 22, 3391);
        g.speckle('^', cx - 10, 34, 7, 5, 8, 5153);

        /* --- body: a dark line, barely wider than the head. Drawn over the
               inner wings, because a white creature on white wings is only
               legible if the one dark shape on it survives. --- */
        for (var y = 20; y < 50; y++) {
          var half = y < 33 ? 5 : Math.max(1, 5 - Math.round((y - 33) * 0.28));
          g.rect('U', cx - half, y, half * 2 + 1, 1);
          g.set(cx - half, y, 'P');                   /* lit along one edge */
        }

        /* the web of ribs over the chest, and the core burning behind it */
        for (var w = 0; w < 4; w++) g.line('p', cx - 4 + w * 2, 21, cx - 2 + w, 32);
        g.rect('$', cx - 2, 28, 5, 6);
        g.rect('X', cx - 1, 30, 3, 3);
        g.set(cx, 31, 'Q');
        g.set(cx - 3, 43, 'X'); g.set(cx + 3, 43, 'X');  /* sockets on the hips */

        /* --- head: narrow, pale, one eye. Drawn last so nothing buries it. */
        g.oval('I', cx, 16, 3, 6);
        g.rect('(', cx - 1, 10, 3, 5);
        g.set(cx, 15, 'X');
        g.rect('U', cx - 1, 19, 3, 3);

        /* --- legs: long, thin, splaying to points --- */
        g.line('U', cx - 2, 48, cx - 6, 62);
        g.line('U', cx - 6, 62, cx - 5, 67);
        g.line('P', cx - 3, 50, cx - 6, 61);

        /* --- the crossed mark that flanks it: laid ON the lower wing, not
               floating beside it, or at sprite size it reads as a stray glyph */
        g.line(')', cx - 19, 42, cx - 15, 46);
        g.line(')', cx - 19, 46, cx - 15, 42);

        g.mirrorX();
        form(g, { '(': ['Q', ')'], ')': ['(', 'i'], 'P': ['p', 'U'],
                  'p': [null, 'P'], 'I': ['Q', '('] });
        g.outline('K');
      });
    });
  };

  /* Garatu: the abductor, and the first thing anyone sees - he is on the
     title screen behind the menu.

     He used to be a red winged demon, which was the wrong monster. What takes
     you is supposed to be beautiful and to be doing something appalling, and
     the whole point is that those are the same creature: a red demon reads as
     a villain from the first frame and there is no contradiction left to feel.
     So he is angelic now - bone feathers, coral growth, one red eye - and the
     horror is that he looks like this while he does it.

     SIX WINGS, THREE A SIDE, and they have to read as six. One great pair
     with a couple of smaller ones tucked behind it reads as two wings with
     detail on them, so each pair leaves the shoulder at its own angle from its
     own root - upper rising and curling in, middle thrown widest, lower angled
     out and down - and the tones alternate between them. Three wings the same
     colour touching edge to edge is one wing with lines on it, whatever the
     geometry underneath is doing. The middle pair needs both bend and depth
     for the same reason the Aurelith's does: run out level and uniformly thin
     it is a plank through the sprite, not a wing.

     He is still not the Aurelith. That one fans its four pairs into a
     starburst and is bigger everywhere; this is a herald, not an ending. */
  Spr.garatu = function (frame) {
    return cached('ga:' + frame, function () {
      return Px.make(64, 64, function (g) {
        var cx = 32;
        /* the bend that accumulates along each wing spine; the root holds */
        var flap = frame ? 0.014 : 0;

        /* SIX WINGS, THREE A SIDE, each its own wing rather than one great
           pair. Canvas angles: y grows downward, so PI points left and 4.71 is
           straight up.

           What makes them read as six and not as two is that each pair leaves
           the shoulder at its own angle and from its own root, so they fan
           with dark between them - and that the tones alternate. Three wings
           the same colour touching edge to edge is one wing with lines on it,
           whatever the geometry underneath is doing. */
        /* upper: rises and curls inward over the head */
        wing(g, cx - 4, 23, 3.92, 0.044, 21, 6, '(', ')', 'Q', flap * 1.3);
        /* middle: the widest. It needs BOTH bend and depth - run out nearly
           level and uniformly thin it was a grey plank stuck through the
           sprite, which is the same note the Aurelith's middle pair carries. */
        wing(g, cx - 4, 29, 3.30, -0.034, 23, 9, ')', ')', '(', flap);
        /* lower: out and down, the shortest of the three. Edged warm rather
           than in the cold snow tone, which at depth 5 read as blue spikes
           rather than as the underside of a wing. */
        wing(g, cx - 3, 35, 2.80, -0.038, 18, 6, '(', ')', ')', flap * 0.7);

        /* Growth, seeded so he bakes identically every run. It stays LOW, in
           against the shoulders and the inner wing, the way it does on the
           reference: spread across the whole span it turns the wings to noise
           and the arch stops being a shape. This is also the part that says
           the beauty is diseased rather than holy. */
        g.speckle('N', cx - 12, 16, 6, 5, 7, 7717);
        g.speckle('^', cx - 14, 27, 11, 5, 14, 3391);
        g.speckle('^', cx - 9, 33, 6, 4, 6, 5153);

        /* Body: one dark stroke, narrower than the Aurelith's. A pale creature
           on pale wings is only legible if the one dark shape on it survives,
           so this goes down over the inner feathers. */
        for (var y = 20; y < 45; y++) {
          var half = y < 30 ? 4 : Math.max(1, 4 - Math.round((y - 30) * 0.24));
          g.rect('U', cx - half, y, half * 2 + 1, 1);
          g.set(cx - half, y, 'P');                   /* lit along one edge */
        }
        /* the lattice over the chest, and a slit of light behind it. A SLIT,
           where the Aurelith burns a square - the ending gets the bigger heart */
        for (var w = 0; w < 3; w++) g.line('p', cx - 3 + w * 2, 21, cx - 1 + w, 30);
        g.rect('$', cx - 1, 26, 3, 6);
        g.rect('X', cx, 27, 1, 4);

        /* head: small, pale, one eye, on a long neck. Drawn last so the wings
           cannot bury the one thing that looks back at you. */
        g.oval('I', cx, 15, 3, 5);
        g.rect('(', cx - 1, 10, 3, 4);
        g.set(cx, 14, 'X');
        g.rect('U', cx - 1, 18, 3, 3);

        /* LEGS, NOT TENTACLES. They were two one-pixel lines with a slight
           wander in them, which is a tentacle however you label it. What makes
           a leg is a JOINT and some width: a thigh swinging out to a knee, a
           shin coming back in under the body, and a foot at the end of it. The
           lit column down the front gives the limb a round side. */
        limb(g, 'U', cx - 3, 43, cx - 8, 52, 3);      /* thigh, out to the knee */
        limb(g, 'U', cx - 8, 52, cx - 6, 59, 3);      /* shin, back in under it */
        g.rect('U', cx - 8, 59, 5, 2);                /* the foot */
        g.set(cx - 9, 60, 'U');
        limb(g, 'P', cx - 3, 43, cx - 8, 52, 1);      /* lit down the front */
        limb(g, 'P', cx - 8, 52, cx - 6, 59, 1);
        g.rect('p', cx - 9, 51, 3, 2);                /* the knee catches light */

        g.mirrorX();
        form(g, { '(': ['Q', ')'], ')': ['(', 'i'], 'P': ['p', 'U'],
                  'p': [null, 'P'], 'I': ['Q', '('] });
        g.outline('K');
      });
    });
  };

    this.timeLeft = 0;

    this.objectiveFailed = false;
    this.spawnQueue = [];
    this.push = null;              /* the stone currently being pushed, if any */
    this.message = null; this.messageTime = 0;
    /* A card stops the trial and waits to be read. The gem used the 4.5s
       banner, which is the same channel as 'Hint 2/3 found' - so the one
       permanent stat choice in the run arrived with less ceremony than a
       hint, slid past in the corner, and players reached the hub with no idea
       they were carrying anything. Anything that changes the run permanently
       gets one of these instead. */
    this.card = null;

    /* --- scripted-sequence support (the tutorial; inert everywhere else) --- */
    this.untimed = !!spec.untimed;   /* no clock, and no timeout loss */
    this.persistentPrompt = null;    /* banner text that stays until cleared */
    this.lockedActions = null;       /* { attack: true, ... } - HUD greys these out */
    this.decor = [];                 /* hand-placed props, depth-sorted with bodies */
    this.markers = [];               /* ground rings: pedestals, the exit gate */
    this.worldLabels = [];           /* { x, y, text, colour } drawn by the HUD */
    this.screenLabels = [];          /* the above, projected - filled each frame */

    this.stats = V.Save.resolveStats(game.save);
    this.player = new E.Player(this.stats, game.save.weapon, this);
    this.player.drawScale = 1.8;
    this.player.tint = game.playerTint();
    this.player.outfit = game.playerOutfit();

    this.consumables = game.consumableCounts();

    this.build();
    this.cam.x = this.player.x;
    this.cam.y = this.player.y;
  }

  /* ==================================================================== gen */
  Trial.prototype.build = function () {
    var r = this.rng, i, a, d;

    /* barrier ring (GDD 5: player cannot leave) */
    var ringCount = 104;
    for (i = 0; i < ringCount; i++) {
      a = (i / ringCount) * U.TAU;
      var jitter = r.range(-14, 14);
      this.props.push({
        x: Math.cos(a) * (this.barrierR + jitter),
        y: Math.sin(a) * (this.barrierR + jitter),
        kind: this.env.barrier, s: r.range(1.0, 1.35), seed: r.int(0, 9999), solid: true
      });
    }
    /* a second, sparser row for depth */
    for (i = 0; i < ringCount; i += 2) {
      a = (i / ringCount) * U.TAU + 0.04;
      this.props.push({
        x: Math.cos(a) * (this.barrierR + 62), y: Math.sin(a) * (this.barrierR + 62),
        kind: this.env.barrier, s: r.range(0.9, 1.2), seed: r.int(0, 9999)
      });
    }

    /* cover (GDD 5 + 7.3), thinned in step with the floor area so a small
       arena is dotted rather than carpeted. area === 1 at the default radius,
       so the standard trials generate exactly what they always did. */
    var area = (this.radius / ARENA_R) * (this.radius / ARENA_R);
    var bushes = Math.max(8, Math.round((44 + r.int(0, 16)) * area));
    for (i = 0; i < bushes; i++) {
      a = r() * U.TAU; d = Math.sqrt(r()) * (this.radius - 120);
      this.cover.push({
        x: Math.cos(a) * d, y: Math.sin(a) * d,
        kind: this.env.cover, s: r.range(0.9, 1.3), seed: r.int(0, 9999), r: 46
      });
    }

    /* ground litter */
    var litter = Math.max(30, Math.round(150 * area));
    for (i = 0; i < litter; i++) {
      a = r() * U.TAU; d = Math.sqrt(r()) * (this.radius - 40);
      this.props.push({
        x: Math.cos(a) * d, y: Math.sin(a) * d,
        kind: r.chance(0.55) ? 'tuft' : this.env.litter,
        s: r.range(0.7, 1.3), seed: r.int(0, 9999)
      });
    }

    /* player start: near the south edge, looking in */
    this.player.x = 0;
    this.player.y = this.radius * 0.62;
    this.player.facing = -Math.PI / 2;

    this.setupObjective();
  };

  Trial.prototype.randomPoint = function (minD, maxD, awayFromPlayer) {
    var r = this.rng;
    for (var tries = 0; tries < 40; tries++) {
      var a = r() * U.TAU;
      var d = U.lerp(minD, maxD, Math.sqrt(r()));
      var x = Math.cos(a) * d, y = Math.sin(a) * d;
      if (!awayFromPlayer || U.dist2(x, y, this.player.x, this.player.y) > awayFromPlayer * awayFromPlayer) {
        return { x: x, y: y };
      }
    }
    return { x: 0, y: 0 };
  };

  /* difficulty ramp across the 50-trial demo */
  Trial.prototype.tier = function () {
    return 1 + (this.spec.index - 1) / D.TOTAL_TRIALS * 1.9;   /* 1.0 -> ~2.9 */
  };

  Trial.prototype.setupObjective = function () {
    var r = this.rng, i, p;
    var tier = this.tier();
    var scaleOpts = { hpScale: 0.8 + tier * 0.35, dmgScale: 0.75 + tier * 0.28, speedScale: 0.9 + tier * 0.08 };
    this.scaleOpts = scaleOpts;

    if (this.spec.boss) {
      this.type = 'boss';
      this.setHuntRules();
      this.objective = { text: 'Defeat the ' + (this.spec.finalBoss ? 'Aurelith' : 'Reaper') };
      this.timeLimit = this.spec.finalBoss ? 300 : 180;
      var bossId = this.spec.finalBoss ? 'aurelith' : 'reaper';
      var boss = this.spawnEnemy(bossId, 0, -this.radius * 0.35, {
        hpScale: 0.7 + tier * 0.5, dmgScale: 0.8 + tier * 0.22, speedScale: 1
      });
      this.boss = boss;
      for (i = 0; i < 2 + Math.floor(tier); i++) {
        p = this.randomPoint(200, this.radius - 150, 340);
        this.spawnEnemy('goblin', p.x, p.y, scaleOpts);
      }
      /* The old par of maxHp * 1.35 + 180 could not be reached by ANY play.
         On completion the score tops out near par*0.68 + maxHp*0.3 + the time
         bonus, so a flawless kill scored 4343 against a par of 4649 - ratio
         0.93, the 30th percentile. Top 25% was arithmetically impossible, and
         since only the top 25% is paid, no boss in the game had ever paid a
         reward. This par is reachable: a clean kill lands around the 19th. */
      this.par = boss.maxHp * 0.82 + 220;
      this.timeLeft = this.timeLimit;
      return;
    }

    this.type = this.spec.type;
    this.setHuntRules();

    switch (this.type) {
      case 'tutorial': { V.Tutorial.setup(this); break; }
      case 'defeat': {
        var target = 6 + Math.round(tier * 5);
        this.target = target;
        this.timeLimit = 90 + target * 4;
        this.objective = { text: 'Defeat ' + target + ' enemies' };
        var inField = Math.min(target, 5 + Math.floor(tier * 2));
        for (i = 0; i < inField; i++) {
          p = this.randomPoint(160, this.radius - 120, 320);
          this.spawnEnemy(this.pickEnemy(tier, r), p.x, p.y, scaleOpts);
        }
        this.remainingToSpawn = target - inField;
        this.par = target * 26 + this.timeLimit * 1.1;
        break;
      }
      case 'defend': {
        this.timeLimit = 60 + Math.round(tier * 22);
        this.zone = { x: 0, y: 0, r: 210, hp: 100, maxHp: 100 };
        this.objective = { text: 'Hold the ground for ' + Math.round(this.timeLimit) + 's' };
        this.player.x = 0; this.player.y = 120;
        this.waveTimer = 2;
        this.par = this.timeLimit * 12 + 380;
        break;
      }
      case 'deliver': {
        this.timeLimit = 100 + Math.round(tier * 12);
        var rp = this.randomPoint(this.radius * 0.5, this.radius - 130, 500);
        this.relic = { x: rp.x, y: rp.y, taken: false };
        /* delivery point roughly opposite the relic */
        var ra = Math.atan2(rp.y, rp.x) + Math.PI;
        this.delivery = { x: Math.cos(ra) * this.radius * 0.6, y: Math.sin(ra) * this.radius * 0.6, r: 95 };
        this.objective = { text: 'Collect the relic, deliver it' };
        for (i = 0; i < 4 + Math.floor(tier * 3); i++) {
          p = this.randomPoint(220, this.radius - 120, 300);
          this.spawnEnemy(this.pickEnemy(tier, r), p.x, p.y, scaleOpts);
        }
        this.par = 380 + this.timeLimit * 1.6;
        break;
      }
      case 'puzzle': {
        this.timeLimit = 130;
        var n = 3;
        this.objective = { text: 'Push the stones onto the marks' };
        for (i = 0; i < n; i++) {
          var ang = (i / n) * U.TAU + r() * 0.6;
          this.blocks.push({ x: Math.cos(ang) * 330, y: Math.sin(ang) * 330, r: 34, done: false });
          this.plates.push({ x: Math.cos(ang + 0.9) * 720, y: Math.sin(ang + 0.9) * 720, r: 56, filled: false });
        }
        /* Tier-appropriate, not goblins forever. The count stays low on
           purpose - this is a thinking trial - but a trial 43 puzzle used to
           field a 55hp goblin while a trial 43 defeat fielded a 227hp
           minotaur, so it was a free pass at exactly the point the run is
           meant to be squeezing. */
        for (i = 0; i < 2 + Math.floor(tier); i++) {
          p = this.randomPoint(300, this.radius - 150, 420);
          this.spawnEnemy(this.pickEnemy(tier, r), p.x, p.y, scaleOpts);
        }
        this.par = 430 + this.timeLimit * 1.5;
        break;
      }
      case 'word': {
        this.timeLimit = 150;
        var pool = D.RIDDLES;
        var q = pool[this.spec.seed % pool.length];
        var opts = r.shuffle([q.a].concat(q.wrong.slice(0, 3)));
        this.riddle = { q: q.q, answer: q.a, options: opts, revealed: 0, answered: false, correct: false };
        this.objective = { text: 'Answer the riddle - hints are hidden in the arena' };
        for (i = 0; i < 3; i++) {
          p = this.randomPoint(300, this.radius - 150, 300);
          this.hints.push({ x: p.x, y: p.y, found: false });
        }
        /* as with the puzzle: the riddle is the trial, but the guards should
           still belong to the tier they are guarding */
        for (i = 0; i < 2 + Math.floor(tier * 1.5); i++) {
          p = this.randomPoint(300, this.radius - 150, 420);
          this.spawnEnemy(this.pickEnemy(tier, r), p.x, p.y, scaleOpts);
        }
        this.par = 420 + this.timeLimit * 1.4;
        break;
      }
      case 'hide': {
        this.timeLimit = 55 + Math.round(tier * 16);
        this.objective = { text: 'Survive unseen for ' + Math.round(this.timeLimit) + 's' };
        this.spottedTime = 0;
        var hunters = 4 + Math.floor(tier * 2.5);
        for (i = 0; i < hunters; i++) {
          p = this.randomPoint(340, this.radius - 120, 420);
          var h = this.spawnEnemy(this.pickEnemy(tier, r), p.x, p.y, scaleOpts);
          h.def = Object.create(h.def);
          h.def.sight = h.def.sight * 1.3;
        }
        this.par = this.timeLimit * 8 + 150;
        break;
      }
      case 'seek': {
        this.timeLimit = 120;
        var hidden = 4 + Math.floor(tier * 1.6);
        this.target = hidden;
        this.objective = { text: 'Find and defeat ' + hidden + ' hidden enemies' };
        var spots = r.shuffle(this.cover.slice());
        for (i = 0; i < hidden; i++) {
          var sp = spots[i % spots.length];
          this.spawnEnemy(this.pickEnemy(tier, r), sp.x + r.range(-14, 14), sp.y + r.range(-14, 14),
            Object.assign({ hiding: true }, scaleOpts));
        }
        this.par = hidden * 38 + this.timeLimit * 1.7;
        break;
      }
    }
    this.timeLeft = this.timeLimit;
  };

  /* Draws from D.ROSTER by tier. This used to be a coin flip between goblin
     and minotaur, which meant every field in the game was one of two things
     and the only thing that changed across 50 trials was how often the second
     one showed up. Now each entry unlocks at its own tier and the starter
     thins out behind it, so a late field is a mixed one. */
  Trial.prototype.pickEnemy = function (tier, r) {
    var roster = D.ROSTER, weights = [], total = 0, i, w;
    for (i = 0; i < roster.length; i++) {
      var e = roster[i];
      w = tier < e.from ? 0 : e.weight;
      if (w && e.fade) w = Math.max(1, w * (1 - (tier - e.from) * e.fade));
      weights.push(w);
      total += w;
    }
    if (total <= 0) return roster[0].id;
    var roll = r() * total;
    for (i = 0; i < roster.length; i++) {
      roll -= weights[i];
      if (roll <= 0) return roster[i].id;
    }
    return roster[0].id;
  };

  /* ============================================================ world hooks */
  /* Both of these read this.type, so they run only once it is settled - the
     boss branch assigns it separately from the normal one. */
  Trial.prototype.setHuntRules = function () {
    /* Once an enemy has seen you it keeps coming. Off in 'hide', where losing
       them again is the whole mechanic: it scores you on how long you spent
       inside someone's chase state. */
    this.stickyAggro = this.type !== 'hide';
    /* Modes where the objective pins the player down rather than sending them
       out to meet the enemy. There they spawn already hunting, or they spawn
       at the rim well outside their own sight and never arrive at all. */
    this.huntOnSpawn = HUNT_MODES[this.type] === true;
  };

  Trial.prototype.spawnEnemy = function (id, x, y, opts) {
    var e = new E.Enemy(id, x, y, this, opts || this.scaleOpts);
    e.drawScale = 1.8;
    this.enemies.push(e);
    return e;
  };

  Trial.prototype.spawnArrow = function (x, y, a, sp, dmg, range, pierce) {
    this.projectiles.push(new E.Projectile(x, y, a, sp, dmg, range, { pierce: pierce }));
  };

  Trial.prototype.spawnBolt = function (x, y, a, sp, dmg, opts) {
    opts = opts || {};
    this.projectiles.push(new E.Projectile(x, y, a, sp, dmg, opts.range || 900,
      { hostile: true, colour: opts.colour || '#ff9ec4' }));
  };

  Trial.prototype.confine = function (ent) {
    U.confineToCircle(ent, 0, 0, this.radius - (ent.radius || 12));
  };

  Trial.prototype.insideArena = function (x, y, pad) {
    return U.dist2(x, y, 0, 0) < (this.radius - (pad || 0)) * (this.radius - (pad || 0));
  };

  Trial.prototype.inCover = function (x, y) {
    for (var i = 0; i < this.cover.length; i++) {
      var c = this.cover[i];
      if (U.dist2(x, y, c.x, c.y) < c.r * c.r) return c;
    }
    return null;
  };

  Trial.prototype.shake = function (amt, time) {
    this.shakeAmt = Math.max(this.shakeAmt, amt);
    this.shakeTime = Math.max(this.shakeTime, time);
  };

  Trial.prototype.burst = function (x, y, n, colour) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * U.TAU, sp = 40 + Math.random() * 130;
      this.particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.3 + Math.random() * 0.4, max: 0.7, r: 2 + Math.random() * 3, colour: colour
      });
    }
  };

  Trial.prototype.dust = function (x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * U.TAU;
      this.particles.push({
        x: x, y: y, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40,
        life: 0.35, max: 0.35, r: 3 + Math.random() * 3, colour: 'rgba(255,255,255,0.7)'
      });
    }
  };

  Trial.prototype.floater = function (x, y, text, colour) {
    this.floaters.push({ x: x, y: y, text: text, colour: colour, life: 0.9, max: 0.9 });
  };

  Trial.prototype.swipe = function (x, y, angle, range, halfArc, kind) {
    this.swipes.push({ x: x, y: y, angle: angle, range: range, halfArc: halfArc, kind: kind, life: 0.18, max: 0.18 });
  };

  Trial.prototype.onEnemyKilled = function (e) {
    this.kills++;
    if (this.type === 'seek') this.foundCount = (this.foundCount || 0) + 1;
    if (this.type === 'tutorial') V.Tutorial.onEnemyKilled(this, e);
  };

  /* Two observation hooks the scripted beats need. Both are no-ops in a
     normal trial, and both are called unconditionally from entities.js. */
  Trial.prototype.onEnemyHurt = function (e, dmg) {
    if (this.type === 'tutorial') V.Tutorial.onEnemyHurt(this, e, dmg);
  };

  Trial.prototype.onPlayerDodge = function () {
    if (this.type === 'tutorial') V.Tutorial.onPlayerDodge(this);
  };

  /* ================================================================ update */
  Trial.prototype.update = function (dt) {
    this.t += dt;

    if (this.state === 'intro') {
      this.introTimer -= dt;
      if (this.introTimer <= 0) { this.state = 'play'; Audio.music(this.spec.boss ? 'boss' : 'trial'); }
      return;
    }
    if (this.state === 'done') { this.updateFx(dt); return; }
    if (this.paused || this.card) return;

    var p = this.player, i;

    /* ---- input ---- */
    var In = this.input;
    /* a scripted beat can hold back an action until it has been taught */
    var locked = this.lockedActions || {};
    if (In.wasPressed('attack') && !locked.attack) {
      if (this.riddle && !this.riddle.answered && this.nearAnswerPad()) { /* handled in HUD taps */ }
      else p.tryAttack(false);
    }
    if (In.wasPressed('special') && !locked.special) p.tryAttack(true);
    if (In.wasPressed('dodge') && !locked.dodge) p.tryDodge();
    if (In.wasPressed('item') && !locked.item) this.useConsumable();

    p.update(dt, In);
    this.updatePush(dt);

    /* ---- entities ---- */
    for (i = 0; i < this.enemies.length; i++) this.enemies[i].update(dt);
    for (i = this.enemies.length - 1; i >= 0; i--) if (this.enemies[i].dead) this.enemies.splice(i, 1);
    for (i = this.projectiles.length - 1; i >= 0; i--) {
      this.projectiles[i].update(dt, this);
      if (this.projectiles[i].dead) this.projectiles.splice(i, 1);
    }
    this.separate();
    this.updateFx(dt);

    /* ---- pickups ---- */
    for (i = this.pickups.length - 1; i >= 0; i--) {
      var pk = this.pickups[i];
      if (U.dist2(pk.x, pk.y, p.x, p.y) < 54 * 54) {
        this.pickups.splice(i, 1);
        if (pk.kind === 'coin') { this.bonusCoins = (this.bonusCoins || 0) + pk.value; Audio.play('coin'); }
        else if (pk.kind === 'heal') { p.heal(30); Audio.play('pickup'); }
      }
    }

    /* ---- timer & objective ---- */
    if (!this.untimed) this.timeLeft -= dt;
    this.updateObjective(dt);

    /* updateObjective runs first on purpose: an untimed trial gets the chance
       to revive the player before the death check below can end the run. */
    if (p.dead) return this.finish('death');
    if (this.objectiveDone) return this.finish('complete');
    if (this.objectiveFailed) return this.finish('objective');
    if (!this.untimed && this.timeLeft <= 0) {
      return this.finish(this.type === 'hide' || this.type === 'defend' ? 'complete' : 'timeout');
    }
  };

  Trial.prototype.updateFx = function (dt) {
    var i;
    for (i = this.particles.length - 1; i >= 0; i--) {
      var pt = this.particles[i];
      pt.life -= dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= Math.pow(0.05, dt); pt.vy *= Math.pow(0.05, dt);
      if (pt.life <= 0) this.particles.splice(i, 1);
    }
    for (i = this.floaters.length - 1; i >= 0; i--) {
      this.floaters[i].life -= dt;
      this.floaters[i].y -= 26 * dt;
      if (this.floaters[i].life <= 0) this.floaters.splice(i, 1);
    }
    for (i = this.swipes.length - 1; i >= 0; i--) {
      this.swipes[i].life -= dt;
      if (this.swipes[i].life <= 0) this.swipes.splice(i, 1);
    }
    if (this.shakeTime > 0) {
      this.shakeTime -= dt;
      if (this.shakeTime <= 0) this.shakeAmt = 0;
    }
    if (this.messageTime > 0) {
      this.messageTime -= dt;
      if (this.messageTime <= 0) this.message = null;
    }
  };

  /* keep bodies from stacking */
  Trial.prototype.separate = function () {
    var list = this.enemies;
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      for (var j = i + 1; j < list.length; j++) {
        var b = list[j];
        var minD = a.radius + b.radius;
        var dx = b.x - a.x, dy = b.y - a.y;
        var d2 = dx * dx + dy * dy;
        if (d2 > minD * minD || d2 < 0.001) continue;
        var d = Math.sqrt(d2);
        var push = (minD - d) / 2;
        var ux = dx / d, uy = dy / d;
        a.x -= ux * push; a.y -= uy * push;
        b.x += ux * push; b.y += uy * push;
      }
    }
    /* stones are solid: brushing one moves the player, never the stone.
       Deliberate pushing is handled by updatePush(). */
    if (!this.push) {
      for (var k = 0; k < this.blocks.length; k++) {
        var bl = this.blocks[k], p = this.player;
        var ddx = p.x - bl.x, ddy = p.y - bl.y;
        var dd = Math.sqrt(ddx * ddx + ddy * ddy);
        var need = bl.r + p.radius;
        if (dd < need && dd > 0.001) {
          var over = need - dd;
          p.x += (ddx / dd) * over;
          p.y += (ddy / dd) * over;
          this.confine(p);
        }
      }
    }
  };

  /* ------------------------------------------------------------ pushing
     Pushing locks to one cardinal axis and pins the player square behind the
     stone, so an off-centre joystick can no longer slide you past it. */
  Trial.prototype.updatePush = function (dt) {
    if (!this.blocks.length) return;
    var p = this.player;
    var mv = this.input.move;
    var PUSH_SPEED = 115;
    var i;

    /* release the lock when you stop, turn away, or get separated */
    if (this.push) {
      var pb = this.push.block;
      var held = this.push.axis === 'x' ? mv.x : mv.y;
      var stillOn = mv.mag > 0.2 && held * this.push.dir > 0.3;
      var near = U.dist(p.x, p.y, pb.x, pb.y) < pb.r + p.radius + 30;
      if (!stillOn || !near || p.atkState || p.dodgeTime > 0) this.push = null;
    }

    /* acquire: must be touching the stone and moving into it */
    if (!this.push && mv.mag > 0.25 && !p.atkState && p.dodgeTime <= 0) {
      for (i = 0; i < this.blocks.length; i++) {
        var b = this.blocks[i];
        if (U.dist(p.x, p.y, b.x, b.y) > b.r + p.radius + 6) continue;
        var toBlock = Math.atan2(b.y - p.y, b.x - p.x);
        if (Math.abs(U.angleDelta(Math.atan2(mv.y, mv.x), toBlock)) > 1.0) continue;
        var axis = Math.abs(b.x - p.x) > Math.abs(b.y - p.y) ? 'x' : 'y';
        var dir = axis === 'x' ? (b.x > p.x ? 1 : -1) : (b.y > p.y ? 1 : -1);
        this.push = { block: b, axis: axis, dir: dir };
        break;
      }
    }
    if (!this.push) return;

    var blk = this.push.block, ax = this.push.axis, dr = this.push.dir;
    var gap = blk.r + p.radius;

    if (ax === 'x') blk.x += dr * PUSH_SPEED * dt;
    else blk.y += dr * PUSH_SPEED * dt;
    U.confineToCircle(blk, 0, 0, this.radius - 60);

    /* pin the player square behind the stone and slide them onto its centre line */
    if (ax === 'x') {
      p.x = blk.x - dr * gap;
      p.y = U.approach(p.y, blk.y, 260 * dt);
      p.facing = dr > 0 ? 0 : Math.PI;
    } else {
      p.y = blk.y - dr * gap;
      p.x = U.approach(p.x, blk.x, 260 * dt);
      p.facing = dr > 0 ? Math.PI / 2 : -Math.PI / 2;
    }
    p.moving = true;
    this.confine(p);
  };

  /* `card` is { title, role, body, colour, glow }. Everything but title and
     body is optional. It holds the trial until the player dismisses it. */
  Trial.prototype.showCard = function (card) { this.card = card; };
  Trial.prototype.dismissCard = function () { this.card = null; };

  Trial.prototype.setMessage = function (txt, time) {
    this.message = txt;
    this.messageTime = time || 2.2;
  };

  Trial.prototype.updateObjective = function (dt) {
    var p = this.player, i;

    switch (this.type) {
      case 'tutorial': { V.Tutorial.update(this, dt); break; }
      case 'boss': {
        if (this.boss.dead || this.enemies.indexOf(this.boss) < 0) this.objectiveDone = true;
        break;
      }
      case 'defeat': {
        /* trickle in the remainder */
        if (this.remainingToSpawn > 0 && this.enemies.length < 6) {
          var sp = this.randomPoint(this.radius * 0.5, this.radius - 120, 380);
          this.spawnEnemy(this.pickEnemy(this.tier(), this.rng), sp.x, sp.y, this.scaleOpts);
          this.remainingToSpawn--;
        }
        if (this.kills >= this.target) this.objectiveDone = true;
        break;
      }
      case 'defend': {
        this.waveTimer -= dt;
        if (this.waveTimer <= 0) {
          this.waveTimer = Math.max(1.6, 5.2 - this.tier() * 0.9);
          var n = 1 + Math.floor(this.tier());
          for (i = 0; i < n; i++) {
            var a = Math.random() * U.TAU;
            this.spawnEnemy(this.pickEnemy(this.tier(), this.rng),
              Math.cos(a) * (this.radius - 60), Math.sin(a) * (this.radius - 60), this.scaleOpts);
          }
        }
        /* enemies inside the zone chew on it */
        for (i = 0; i < this.enemies.length; i++) {
          var e = this.enemies[i];
          if (U.dist2(e.x, e.y, this.zone.x, this.zone.y) < this.zone.r * this.zone.r) {
            this.zone.hp -= 7 * dt;
          }
        }
        if (this.zone.hp <= 0) { this.zone.hp = 0; this.objectiveFailed = true; }
        break;
      }
      case 'deliver': {
        if (!this.relic.taken && U.dist2(p.x, p.y, this.relic.x, this.relic.y) < 58 * 58) {
          this.relic.taken = true;
          p.carrying = 'relic';
          Audio.play('pickup');
          this.setMessage('Relic taken - get it to the marker');
        }
        if (this.relic.taken && U.dist2(p.x, p.y, this.delivery.x, this.delivery.y) < this.delivery.r * this.delivery.r) {
          this.objectiveDone = true;
        }
        break;
      }
      case 'puzzle': {
        var solved = 0;
        for (i = 0; i < this.plates.length; i++) {
          var pl = this.plates[i];
          pl.filled = false;
          for (var b = 0; b < this.blocks.length; b++) {
            if (U.dist2(this.blocks[b].x, this.blocks[b].y, pl.x, pl.y) < pl.r * pl.r) { pl.filled = true; break; }
          }
          if (pl.filled) solved++;
        }
        if (solved !== this.lastSolved) {
          if (solved > (this.lastSolved || 0)) Audio.play('confirm');
          this.lastSolved = solved;
        }
        if (solved >= this.plates.length) this.objectiveDone = true;
        break;
      }
      case 'word': {
        for (i = 0; i < this.hints.length; i++) {
          var h = this.hints[i];
          if (!h.found && U.dist2(p.x, p.y, h.x, h.y) < 62 * 62) {
            h.found = true;
            this.riddle.revealed++;
            Audio.play('pickup');
            this.setMessage('Hint ' + this.riddle.revealed + '/3 found');
          }
        }
        if (this.riddle.answered) {
          if (this.riddle.correct) this.objectiveDone = true;
          else this.objectiveFailed = true;
        }
        break;
      }
      case 'hide': {
        var spotted = false;
        for (i = 0; i < this.enemies.length; i++) {
          if (this.enemies[i].state === 'chase' || this.enemies[i].state === 'windup' ||
              this.enemies[i].state === 'charge') { spotted = true; break; }
        }
        if (spotted) this.spottedTime += dt;
        this.spotted = spotted;
        break;
      }
      case 'seek': {
        var left = 0;
        for (i = 0; i < this.enemies.length; i++) if (!this.enemies[i].dead) left++;
        this.enemiesLeft = left;
        if (left === 0) this.objectiveDone = true;
        break;
      }
    }
  };

  Trial.prototype.useConsumable = function () {
    var g = this.game;
    if (this.consumables.potion > 0 && this.player.hp < this.stats.maxHp * 0.75) {
      this.consumables.potion--; g.spendConsumable('c_potion');
      this.player.heal(50); Audio.play('pickup');
      this.floater(this.player.x, this.player.y - 50, '+50', '#7fe08a');
      return;
    }
    if (this.consumables.tonic > 0 && this.player.stamina < this.stats.maxStamina * 0.5) {
      this.consumables.tonic--; g.spendConsumable('c_tonic');
      this.player.stamina = this.stats.maxStamina; Audio.play('pickup');
      return;
    }
    if (this.consumables.smoke > 0) {
      this.consumables.smoke--; g.spendConsumable('c_smoke');
      this.player.smokeTimer = 6;
      for (var i = 0; i < this.enemies.length; i++) {
        this.enemies[i].state = 'idle'; this.enemies[i].stateTime = 0;
      }
      this.burst(this.player.x, this.player.y, 26, 'rgba(220,220,230,0.9)');
      Audio.play('dodge');
      this.setMessage('Smoke - they lost you');
      return;
    }
    Audio.play('deny');
  };

  Trial.prototype.answerRiddle = function (choice) {
    if (!this.riddle || this.riddle.answered) return;
    this.riddle.answered = true;
    this.riddle.correct = (choice === this.riddle.answer);
    Audio.play(this.riddle.correct ? 'confirm' : 'deny');
  };

  Trial.prototype.nearAnswerPad = function () { return !!this.riddle; };

  /* ================================================================ scoring */
  /* Per-type scoring weights. Puzzles deliberately lean on completing cleanly
     rather than on raw speed: `time` is small and `flawless` rewards taking no
     damage, so knowing the layout and doing it carefully beats sprinting. */
  var SCORE = {
    defeat:  { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    defend:  { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    deliver: { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    seek:    { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    hide:    { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    boss:    { complete: 0.68, time: 1.15, kill: 16, damage: 0.75 },
    puzzle:  { complete: 0.92, time: 0.50, kill: 16, damage: 0.90, flawless: 0.10 },
    word:    { complete: 0.92, time: 0.45, kill: 16, damage: 0.90, flawless: 0.10 }
  };

  Trial.prototype.finish = function (reason) {
    if (this.state === 'done') return;
    this.state = 'done';
    Audio.music(null);

    var w = SCORE[this.type] || SCORE.defeat;
    var score = 0;
    var timeBonus = Math.max(0, this.timeLeft) * w.time;
    var killScore = this.kills * w.kill;
    var damagePenalty = this.player.damageTaken * w.damage;

    var completed = (reason === 'complete');
    if (completed) {
      score += this.par * w.complete;
      score += timeBonus;
      /* care, not speed: finishing untouched is worth as much as a fast run */
      if (w.flawless && this.player.damageTaken <= 0) score += this.par * w.flawless;
    }
    score += killScore;

    if (this.type === 'hide') {
      /* rewarded for staying unseen, not for kills */
      var unseen = Math.max(0, this.timeLimit - this.spottedTime);
      score = (completed ? this.par * 0.62 : 0) + unseen * 5 + killScore * 0.5;
    }
    if (this.type === 'defend' && completed) {
      score += (this.zone.hp / this.zone.maxHp) * this.par * 0.22;
    }
    if (this.type === 'puzzle') {
      /* stones already set count even if the clock beats you */
      var set = 0;
      for (var pl = 0; pl < this.plates.length; pl++) if (this.plates[pl].filled) set++;
      if (!completed) score += (set / Math.max(1, this.plates.length)) * this.par * 0.35;
    }
    if (this.type === 'word') {
      if (completed) {
        /* answering on fewer hints is a real gamble, and pays for it */
        score += (3 - this.riddle.revealed) * this.par * 0.06;
      } else {
        score += (this.riddle.revealed / 3) * this.par * 0.2;
      }
    }
    if (this.type === 'boss' && completed) {
      score += this.boss ? this.boss.maxHp * 0.3 : 0;
    }

    score -= damagePenalty;
    if (reason === 'death') score = Math.min(score, this.par * 0.2);
    if (reason === 'timeout' || reason === 'objective') score = Math.min(score, this.par * 0.55);
    score = Math.max(0, Math.round(score));

    /* GDD 6.2: ratio 1.0 => top 25%, 0.8 => 40% boundary */
    var ratio = score / Math.max(1, this.par);
    var percentile = U.clamp(Math.round(100 - 75 * ratio), 1, 99);
    if (reason === 'death') percentile = Math.max(percentile, 62);

    /* The final boss is the ending, not a ranked trial. Killing it wins the
       game whatever a percentile would have said - it used to be scored like
       any other trial, so a player could kill Aurelith, be told they failed,
       and be dropped straight back into the same fight with no way out. */
    if (completed && this.spec.finalBoss) percentile = 1;
    /* And no boss you actually killed counts as a failure. Failing is for not
       finishing: running out of time, losing the objective, or dying. */
    else if (completed && this.type === 'boss') percentile = Math.min(percentile, 40);

    var tier = D.RANK_TIERS[2];
    for (var i = 0; i < D.RANK_TIERS.length; i++) {
      if (percentile <= D.RANK_TIERS[i].max) { tier = D.RANK_TIERS[i]; break; }
    }

    this.result = {
      reason: reason,
      completed: completed,
      score: score,
      par: Math.round(this.par),
      percentile: percentile,
      tier: tier,
      kills: this.kills,
      timeLeft: Math.max(0, this.timeLeft),
      damageTaken: Math.round(this.player.damageTaken),
      bonusCoins: this.bonusCoins || 0,
      died: reason === 'death',
      trial: this.spec
    };
    Audio.play(tier.outcome === 'fail' ? 'lose' : 'win');
    this.game.onTrialFinished(this.result);
  };

  /* ================================================================= render
     Everything below works in BUFFER PIXELS, not world units. ZOOM converts
     between them, and it is fixed so one sprite pixel is always one buffer
     pixel - which is what stops pixel art from shimmering as you move. */
  var ZOOM = 0.26;

  Trial.prototype.render = function (ctx, cw, ch) {
    var p = this.player;
    var Px = V.Px, Spr = V.Spr;

    /* camera lead + smoothing, in world units */
    var lead = 175;
    var tx = p.x + Math.cos(p.facing) * lead * 0.35;
    var ty = p.y + Math.sin(p.facing) * lead * 0.35;
    this.cam.x = U.lerp(this.cam.x, tx, 0.2);
    this.cam.y = U.lerp(this.cam.y, ty, 0.2);

    /* Keep the view inside the arena. Standing near an edge used to show a
       screenful of nothing past the barrier - badly so in portrait, where the
       3/4 squash makes the vertical view over 2500 units tall, taller than the
       arena itself. Where the arena no longer fills the view, lock that axis
       to centre rather than letting the camera drift off the map. */
    var limX = Math.max(0, this.barrierR + 90 - (cw / 2) / ZOOM);
    var limY = Math.max(0, this.barrierR + 90 - (ch / 2) / (ZOOM * Art.SQUASH));
    this.cam.x = U.clamp(this.cam.x, -limX, limX);
    this.cam.y = U.clamp(this.cam.y, -limY, limY);

    var shakeX = 0, shakeY = 0;
    if (this.shakeTime > 0) {
      shakeX = Math.round((Math.random() - 0.5) * this.shakeAmt * ZOOM * 2);
      shakeY = Math.round((Math.random() - 0.5) * this.shakeAmt * ZOOM * 2);
    }

    ctx.fillStyle = this.env.sky;
    ctx.fillRect(0, 0, cw, ch);

    this._originX = Math.round(cw / 2) + shakeX;
    this._originY = Math.round(ch / 2) + shakeY;

    ctx.save();
    ctx.translate(this._originX, this._originY);

    var self = this;
    function P(x, y) {
      return { x: Math.round((x - self.cam.x) * ZOOM), y: Math.round((y - self.cam.y) * Art.SQUASH * ZOOM) };
    }
    this.project = P;
    this.screenFloaters = [];
    this.screenLabels = [];

    this.drawGround(ctx, P, cw, ch);

    /* cull to the visible box, with a margin for tall sprites */
    var halfW = cw / 2 + 60, halfH = ch / 2 + 80;
    function visible(sp) { return Math.abs(sp.x) < halfW && Math.abs(sp.y) < halfH; }

    var list = [];
    var i;

    for (i = 0; i < this.props.length; i++) {
      var pr = this.props[i];
      var sp = P(pr.x, pr.y);
      if (!visible(sp)) continue;
      list.push({ y: pr.y, spr: Spr.prop(pr.kind, pr.seed), x: sp.x, sy: sp.y });
    }
    for (i = 0; i < this.cover.length; i++) {
      var cv = this.cover[i];
      var sc = P(cv.x, cv.y);
      if (!visible(sc)) continue;
      list.push({ y: cv.y, spr: Spr.prop(cv.kind, cv.seed), x: sc.x, sy: sc.y });
    }
    for (i = 0; i < this.blocks.length; i++) {
      var bl = this.blocks[i];
      var sb = P(bl.x, bl.y);
      if (!visible(sb)) continue;
      list.push({ y: bl.y, spr: Spr.prop('stone', i), x: sb.x, sy: sb.y });
    }
    /* hand-placed scenery: already baked sprites, so they just join the sort */
    for (i = 0; i < this.decor.length; i++) {
      var dc = this.decor[i];
      if (dc.hidden) continue;
      var sd = P(dc.x, dc.y);
      if (!visible(sd)) continue;
      list.push({ y: dc.y, spr: dc.spr, x: sd.x, sy: sd.y + (dc.lift || 0) });
    }

    for (i = 0; i < this.enemies.length; i++) {
      (function (e) {
        var s2 = P(e.x, e.y);
        e.sx = s2.x; e.sy = s2.y;
        if (!visible(s2)) return;
        list.push({ y: e.y, fn: function () { e.draw(ctx, self.t); } });
      })(this.enemies[i]);
    }
    (function (pl) {
      var s3 = P(pl.x, pl.y);
      pl.sx = s3.x; pl.sy = s3.y;
      list.push({ y: pl.y + 0.1, fn: function () { pl.draw(ctx, self.t); } });
    })(p);

    for (i = 0; i < this.projectiles.length; i++) {
      (function (pj) {
        var s4 = P(pj.x, pj.y);
        pj.sx = s4.x; pj.sy = s4.y - 6;
        for (var k = 0; k < pj.trail.length; k++) {
          var tp = P(pj.trail[k].x, pj.trail[k].y);
          pj.trail[k].sx = tp.x; pj.trail[k].sy = tp.y - 6;
        }
        list.push({ y: pj.y, fn: function () { pj.draw(ctx); } });
      })(this.projectiles[i]);
    }

    this.drawObjectiveGround(ctx, P);

    list.sort(function (a, b) { return a.y - b.y; });
    for (i = 0; i < list.length; i++) {
      var it = list[i];
      if (it.fn) it.fn();
      else Px.draw(ctx, it.spr, it.x, it.sy);
    }

    this.drawFx(ctx, P);
    this.drawObjectiveOverlay(ctx, P);

    ctx.restore();
  };

  Trial.prototype.drawGround = function (ctx, P, cw, ch) {
    var c = P(0, 0);
    var r = this.radius * ZOOM;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, r, r * Art.SQUASH, 0, 0, U.TAU);
    ctx.closePath();
    ctx.clip();

    ctx.fillStyle = this.env.ground;
    ctx.fillRect(c.x - r - 4, c.y - r - 4, r * 2 + 8, r * 2 + 8);

    /* the tiled floor, anchored to the world origin so it scrolls with the map */
    var pat = V.Spr.groundPattern(ctx, this.env.id);
    if (pat) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.fillStyle = pat;
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.restore();
    }

    /* darken toward the tree line */
    var grd = ctx.createRadialGradient(c.x, c.y, r * 0.6, c.x, c.y, r);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(20,16,26,0.4)');
    ctx.fillStyle = grd;
    ctx.fillRect(c.x - r, c.y - r, r * 2, r * 2);
    ctx.restore();
  };

  Trial.prototype.drawObjectiveGround = function (ctx, P) {
    var t = this.t, i, sp;
    if (this.zone) {
      sp = P(this.zone.x, this.zone.y);
      var zr = this.zone.r * ZOOM;
      var frac = this.zone.hp / this.zone.maxHp;
      ctx.fillStyle = 'rgba(90,200,255,' + (0.12 + 0.05 * Math.sin(t * 2)) + ')';
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, zr, zr * Art.SQUASH, 0, 0, U.TAU);
      ctx.fill();
      ctx.strokeStyle = frac > 0.4 ? '#5ac8ff' : '#ff6a6a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, zr, zr * Art.SQUASH, 0, -Math.PI / 2, -Math.PI / 2 + U.TAU * frac);
      ctx.stroke();
    }
    if (this.delivery) {
      sp = P(this.delivery.x, this.delivery.y);
      var dr = this.delivery.r * ZOOM;
      ctx.strokeStyle = this.relic.taken ? '#7fe08a' : 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, dr, dr * Art.SQUASH, 0, 0, U.TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    for (i = 0; i < this.plates.length; i++) {
      sp = P(this.plates[i].x, this.plates[i].y);
      var pr2 = this.plates[i].r * ZOOM;
      ctx.fillStyle = this.plates[i].filled ? 'rgba(120,240,150,0.3)' : 'rgba(255,228,92,0.18)';
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, pr2, pr2 * Art.SQUASH, 0, 0, U.TAU);
      ctx.fill();
      ctx.strokeStyle = this.plates[i].filled ? '#7fe08a' : '#ffe45c';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    /* scripted rings - weapon pedestals, the exit gate */
    for (i = 0; i < this.markers.length; i++) {
      var mk = this.markers[i];
      if (mk.hidden) continue;
      sp = P(mk.x, mk.y);
      var mr = mk.r * ZOOM;
      var puls = 0.16 + 0.08 * Math.sin(t * 3 + i);
      ctx.fillStyle = U.rgba(mk.colour || '#ffe45c', mk.active === false ? 0.06 : puls);
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, mr, mr * Art.SQUASH, 0, 0, U.TAU);
      ctx.fill();
      ctx.strokeStyle = U.rgba(mk.colour || '#ffe45c', mk.active === false ? 0.25 : 0.9);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  };

  Trial.prototype.drawObjectiveOverlay = function (ctx, P) {
    var Px = V.Px, Spr = V.Spr, t = this.t, sp, i;
    var bob = Math.round(Math.sin(t * 3) * 2);
    if (this.relic && !this.relic.taken) {
      sp = P(this.relic.x, this.relic.y);
      Px.shadow(ctx, sp.x, sp.y, 4, 0.2);
      Px.draw(ctx, Spr.prop('relic', 0), sp.x, sp.y - 4 + bob);
    }
    if (this.relic && this.relic.taken) {
      sp = P(this.player.x, this.player.y);
      Px.draw(ctx, Spr.prop('relic', 0), sp.x, sp.y - 30 + bob);
    }
    for (i = 0; i < this.hints.length; i++) {
      if (this.hints[i].found) continue;
      sp = P(this.hints[i].x, this.hints[i].y);
      Px.draw(ctx, Spr.prop('hint', 0), sp.x, sp.y - 2 + bob);
    }

    /* Labels are projected here but drawn by the HUD at full resolution: the
       world buffer is ~240px tall, and text baked into it is unreadable. */
    for (i = 0; i < this.worldLabels.length; i++) {
      var wl = this.worldLabels[i];
      if (wl.hidden) continue;
      sp = P(wl.x, wl.y);
      this.screenLabels.push({ x: sp.x, y: sp.y + (wl.lift || -34), text: wl.text, colour: wl.colour || '#ffe45c' });
    }

    var target = null;
    if (this.relic && !this.relic.taken) target = this.relic;
    else if (this.delivery && this.relic && this.relic.taken) target = this.delivery;
    else if (this.zone) target = this.zone;
    else if (this.guideTarget) target = this.guideTarget;
    if (target) this.drawGuide(ctx, P, target);
  };

  Trial.prototype.drawGuide = function (ctx, P, target) {
    var p = this.player;
    if (U.dist(p.x, p.y, target.x, target.y) < 330) return;
    var a = Math.atan2((target.y - p.y) * Art.SQUASH, target.x - p.x);
    var sp = P(p.x, p.y);
    ctx.save();
    ctx.translate(sp.x + Math.cos(a) * 22, sp.y - 14 + Math.sin(a) * 22);
    ctx.rotate(a);
    ctx.fillStyle = '#ffe45c';
    ctx.fillRect(0, -1, 5, 3);
    ctx.fillRect(4, -3, 2, 7);
    ctx.fillRect(6, -1, 2, 3);
    ctx.restore();
  };

  Trial.prototype.drawFx = function (ctx, P) {
    var i, sp;
    for (i = 0; i < this.swipes.length; i++) {
      var s = this.swipes[i];
      sp = P(s.x, s.y);
