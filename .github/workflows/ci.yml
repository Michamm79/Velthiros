name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  playtest:
    name: Bundle and playtest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Bundle
        run: npm run build

      # dist/ is committed because it is what people actually open, so it must
      # never drift from src/.
      - name: Check dist/ matches src/
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

      - name: Headless playtest
        run: npm test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/shots/
          if-no-files-found: warn
